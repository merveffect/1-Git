version: 2

models:
  - name: stg_institution_enrichment_candidates
    description: Candidate institution records deduplicated by embedding_input before embedding generation.
    columns:
      - name: inst_name
        description: Candidate institution name.
      - name: country_name
        description: Standardized country name when available.
      - name: country_iso
        description: ISO country code when available.
      - name: embedding_input
        description: Text used as embedding input.

  - name: stg_iso_country_name
    description: ISO alpha-2 to standardized country-name lookup.
    columns:
      - name: iso_code
        description: ISO alpha-2 country code.
      - name: country_name
        description: Standardized country name for the ISO code.

  - name: stg_ror
    description: Cleaned ROR records with display name, country mapping, and domains.
    columns:
      - name: ror_id
        description: ROR identifier.
      - name: ror_display_name
        description: Display name extracted from ROR names array.
      - name: ror_country_iso
        description: Country ISO code extracted from ROR locations.
      - name: ror_country_name
        description: Standardized country name from ISO mapping.
      - name: domains
        description: Array of institution domains associated with the ROR record.

  - name: stg_ror_domains
    description: Unique, non-generic domains that map to exactly one ROR institution.
    columns:
      - name: domain
        description: Normalized email/web domain used for matching.
      - name: ror_id
        description: ROR identifier mapped to the domain.
      - name: ror_name
        description: ROR display name mapped to the domain.
      - name: ror_country
        description: ROR country mapped to the domain.

  - name: stg_wikidata_domains
    description: Unique, non-generic WikiData domains that map to exactly one ROR identifier.
    columns:
      - name: domain
        description: Normalized domain extracted from WikiData website URL.
      - name: ror_id
        description: ROR identifier mapped from WikiData.

  - name: stg_ror_match_decisions
    description: Match quality decisions over vector search output using cosine score and country ISO agreement.
    columns:
      - name: candidate_input
        description: Candidate embedding input.
      - name: candidate_inst_name
        description: Candidate institution name.
      - name: candidate_country
        description: Candidate country name.
      - name: candidate_country_iso
        description: Candidate country ISO code.
      - name: ror_id
        description: Matched ROR identifier.
      - name: ror_name
        description: Matched ROR display name.
      - name: ror_country
        description: Matched ROR country name.
      - name: ror_country_iso
        description: Matched ROR country ISO code.
      - name: cosine_similarity
        description: Cosine similarity score from vector search.
      - name: country_iso_match
        description: True when candidate and ROR country ISO codes match.
      - name: match_status
        description: Decision label (1 to 1 match, auto_approve, needs_review, reject).

  - name: stg_ror_ebm_enrichment
    description: Deterministic enrichment from EBM latest affiliation ROR per SNID.
    columns:
      - name: snid
        description: SNID key from EBM individual_contact.
      - name: ror_id
        description: Latest affiliation ROR identifier for the SNID.
      - name: standardized_institution_name
        description: ROR display name joined from stg_ror.
      - name: ror_country
        description: ROR country name joined from stg_ror.
      - name: enrichment_source
        description: Constant source label set to EBM.
