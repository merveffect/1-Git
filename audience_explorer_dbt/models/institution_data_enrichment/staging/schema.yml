version: 2

models:
  - name: stg_inst_enrichment_targets
    description: CDP records that need institution enrichment from authors or researcher profiles.
    columns:
      - name: canonical_segment_id
        description: Unique canonical segment identifier for the CDP record.
        tests:
          - not_null
          - unique
      - name: email
        description: Email address for the CDP record.
      - name: researcher_id
        description: Researcher identifier when available.
      - name: snid
        description: SNID used as a fallback match key when available.
      - name: raw_inst_name
        description: Resolved raw institution name from the available matching source.
        tests:
          - not_null
      - name: enrichment_source
        description: Source used to resolve raw_inst_name (Authors, CRP_by_researcher_id, or CRP_by_snid).
        tests:
          - not_null
          - accepted_values:
              values: ['Authors', 'CRP_by_researcher_id', 'CRP_by_snid']
      - name: country_name
        description: Resolved country name from the available matching source.
      - name: country_iso
        description: Resolved ISO country code from the available matching source.
      - name: embedding_input
        description: Text input passed to the embedding step, combining institution and country when present.
        tests:
          - not_null

  - name: stg_institution_enrichment_candidates
    description: Candidate institution names to be embedded for ROR and TA matching.
    columns:
      - name: inst_name
        description: Normalized institution name candidate.
        tests:
          - not_null
      - name: country_name
        description: Country associated with the institution candidate when available.
        tests:
          - relationships:
              to: ref('stg_iso_country_name')
              field: country_name
      - name: country_iso
        description: ISO country code associated with the institution candidate when available.
      - name: embedding_input
        description: Text input passed to the embedding step, combining institution and country when present.
        tests:
          - unique
          - not_null

  - name: stg_institution_embeddings
    description: Semantic embeddings generated for institution enrichment candidates.
    columns:
      - name: embedding_input
        description: Embedding input text for the candidate institution.
        tests:
          - not_null
          - unique
      - name: inst_name
        description: Candidate institution name.
      - name: country_name
        description: Candidate institution country name.
      - name: country_iso
        description: Candidate institution ISO country code.
      - name: embedding
        description: Vector embedding generated by BigQuery ML.
        tests:
          - not_null
      - name: embedding_status
        description: Status returned by embedding generation.

  - name: stg_iso_country_name
    description: Lookup table mapping ISO country code to standardized country name.
    columns:
      - name: iso_code
        description: ISO alpha-2 country code.
        tests:
          - not_null
          - unique
      - name: country_name
        description: Standardized country name for the ISO code.
        tests:
          - not_null
          - unique

  - name: stg_ror
    description: Research Organization Registry (ROR) data cleaned and standardized for institution matching.
    columns:
      - name: ror_id
        description: ROR identifier.
        tests:
          - not_null
          - unique
      - name: ror_display_name
        description: Display name for the ROR institution.
      - name: ror_country_iso
        description: ISO country code for the ROR institution.
      - name: ror_country_name
        description: Standardized country name for the ROR institution.
      - name: domains
        description: Array of institutional domains associated with ROR.

  - name: stg_ror_embeddings
    description: Semantic embeddings generated for ROR reference institutions.
    columns:
      - name: ror_id
        description: ROR identifier.
        tests:
          - not_null
          - unique
      - name: ror_display_name
        description: ROR display name used for matching.
      - name: ror_country_iso
        description: ISO country code of the ROR institution.
      - name: ror_country_name
        description: Standardized country name of the ROR institution.
      - name: content
        description: Embedding input text for the ROR institution.
      - name: embedding
        description: Vector embedding generated by BigQuery ML.
        tests:
          - not_null
      - name: embedding_status
        description: Status returned by embedding generation.

  - name: stg_ror_matches_vector_search
    description: Top-1 vector similarity matches between candidate institutions and ROR institutions.
    columns:
      - name: candidate_input
        description: Candidate embedding input text.
        tests:
          - not_null
          - unique
      - name: candidate_inst_name
        description: Candidate institution name.
      - name: candidate_country_iso
        description: Candidate institution ISO country code.
      - name: candidate_country
        description: Candidate institution country name.
      - name: ror_id
        description: Matched ROR identifier.
      - name: ror_name
        description: Matched ROR institution name.
      - name: ror_country_iso
        description: Matched ROR institution ISO country code.
      - name: ror_country
        description: Matched ROR institution country name.
      - name: cosine_similarity
        description: Similarity score between candidate and matched ROR institution.

  - name: stg_ror_domains
    description: ROR domains mapped to institutions, excluding generic and ambiguous domains.
    columns:
      - name: domain
        description: Normalized domain used for institution matching.
        tests:
          - not_null
          - unique
      - name: ror_id
        description: ROR identifier for the matched institution.
        tests:
          - not_null
      - name: ror_name
        description: ROR display name for the matched institution.
      - name: ror_country
        description: Country associated with the matched institution.

  - name: stg_wikidata_domains
    description: WikiData domains mapped to ROR identifiers, excluding generic and ambiguous domains.
    columns:
      - name: domain
        description: Normalized domain used for institution matching.
        tests:
          - not_null
          - unique
      - name: ror_id
        description: ROR identifier associated with the domain via WikiData.
        tests:
          - not_null

  - name: stg_ror_match_decisions
    description: Decision logic for vector similarity matches - validates cosine similarity scores and country ISO alignment to determine match quality (1-to-1, auto-approve, needs review, or reject).
    columns:
      - name: candidate_input
        description: Embedding input text for the candidate institution.
        tests:
          - not_null
          - unique
      - name: candidate_inst_name
        description: Candidate institution name.
      - name: candidate_country
        description: Candidate institution country name.
      - name: candidate_country_iso
        description: Candidate institution ISO country code.
      - name: ror_id
        description: Matched ROR identifier.
      - name: ror_name
        description: Matched ROR institution name.
      - name: ror_country
        description: Matched ROR institution country name.
      - name: ror_country_iso
        description: Matched ROR institution ISO country code.
      - name: cosine_similarity
        description: Vector similarity score between 0 and 1. Perfect match = 1.0.
      - name: country_iso_match
        description: Boolean indicating if candidate and ROR country ISO codes match.
      - name: match_status
        description: |
          Match decision status:
          - 1 to 1 match: Perfect similarity (Score = 1.0)
          - auto_approve: High confidence (Score >= 0.97) with matching country
          - needs_review: High to medium confidence (Score >= 0.95) but country mismatch or lower confidence
          - reject: Low confidence match (Score < 0.95)
        tests:
          - not_null
          - accepted_values:
              values: ['1 to 1 match', 'auto_approve', 'needs_review', 'reject']

  - name: stg_ror_ebm_enrichment
    description: EBM deterministic enrichment - resolves snid to latest affiliation ROR ID and joins to stg_ror for the standardized name.
    columns:
      - name: snid
        description: SNID of the individual.
        tests:
          - not_null
          - unique
      - name: ror_id
        description: ROR identifier from the individual's latest affiliation.
        tests:
          - not_null
      - name: standardized_institution_name
        description: Standardized institution name from ROR.
        tests:
          - not_null
      - name: ror_country
        description: Country information from ROR.
      - name: enrichment_source
        description: Always 'EBM' for this model.
        tests:
          - accepted_values:
              values: ['EBM']

  - name: stg_ror_ebm_enrichment_targets
    description: Priority 1 enrichment - EBM deterministic matches joined to CDP users at user grain.
    columns:
      - name: canonical_segment_id
        description: Unique canonical segment identifier.
        tests:
          - not_null
          - unique
      - name: email
        description: Email address for the CDP record.
      - name: researcher_id
        description: Researcher ID if available.
      - name: snid
        description: SNID used to join to EBM enrichment.
      - name: raw_inst_name
        description: Raw institution name from CDP (empty for EBM-enriched users).
      - name: enrichment_source
        description: Always 'EBM' for this model.
        tests:
          - accepted_values:
              values: ['EBM']
      - name: standardized_institution_name
        description: Standardized institution name from ROR.
        tests:
          - not_null
      - name: ror_id
        description: Matched ROR identifier.
        tests:
          - not_null
      - name: ror_country
        description: Country information from ROR.

  - name: stg_ror_vector_enriched_targets
    description: Priority 2 enrichment - vector 1-to-1 ROR matches joined to CDP users at user grain.
    columns:
      - name: canonical_segment_id
        description: Unique canonical segment identifier.
        tests:
          - not_null
          - unique
      - name: email
        description: Email address for the CDP record.
      - name: researcher_id
        description: Researcher ID if available.
      - name: snid
        description: SNID if available.
      - name: raw_inst_name
        description: Original raw institution name from the source.
      - name: enrichment_source
        description: Source used to resolve raw_inst_name (Authors, CRP_by_researcher_id, or CRP_by_snid).
        tests:
          - accepted_values:
              values: ['Authors', 'CRP_by_researcher_id', 'CRP_by_snid']
      - name: standardized_institution_name
        description: Standardized institution name from the matched ROR institution.
        tests:
          - not_null
      - name: ror_id
        description: Matched ROR identifier.
      - name: ror_country
        description: Country information from ROR.

  - name: stg_ror_domain_fallback_targets
    description: Priority 3 fallback enrichment via email domain to ROR mapping. People without vector 1-to-1 match are enriched using their email domain.
    columns:
      - name: canonical_segment_id
        description: Unique canonical segment identifier.
        tests:
          - not_null
          - unique
      - name: email
        description: Email address for domain extraction.
      - name: researcher_id
        description: Researcher ID if available.
      - name: snid
        description: SNID if available.
      - name: raw_inst_name
        description: Original institution name from the source.
      - name: email_domain
        description: Extracted email domain used for matching.
      - name: ror_id
        description: Matched ROR identifier via domain lookup.
        tests:
          - not_null
      - name: standardized_institution_name
        description: Standardized institution name from ROR.
        tests:
          - not_null
      - name: ror_country
        description: Country information from ROR.
      - name: enrichment_source
        description: Always 'Domain_ROR_match' for this model.
        tests:
          - accepted_values:
              values: ['Domain_ROR_match']

  - name: stg_wikidata_fallback_targets
    description: Priority 4 fallback enrichment via WikiData domain to ROR mapping. People without vector/domain matches are enriched using WikiData domain data.
    columns:
      - name: canonical_segment_id
        description: Unique canonical segment identifier.
        tests:
          - not_null
          - unique
      - name: email
        description: Email address for domain extraction.
      - name: researcher_id
        description: Researcher ID if available.
      - name: snid
        description: SNID if available.
      - name: raw_inst_name
        description: Original institution name from the source.
      - name: email_domain
        description: Extracted email domain used for matching.
      - name: ror_id
        description: ROR identifier from WikiData domain mapping.
        tests:
          - not_null
      - name: standardized_institution_name
        description: Standardized institution name from ROR.
        tests:
          - not_null
      - name: ror_country
        description: Country information from ROR.
      - name: enrichment_source
        description: Always 'WIKIDATA_ROR_NAME' for this model (WikiData domain mapped to ROR name).
        tests:
          - accepted_values:
              values: ['WIKIDATA_ROR_NAME']