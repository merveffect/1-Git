version: 2

models:
  - name: stg_institution_embeddings
    description: Embeddings generated from enrichment candidates.
    columns:
      - name: inst_name
        description: Candidate institution name.
      - name: country_name
        description: Candidate country name.
      - name: country_iso
        description: Candidate country ISO code.
      - name: embedding_input
        description: Text content used for embedding generation.
      - name: embedding
        description: Embedding vector output from BigQuery ML.
      - name: embedding_status
        description: Embedding generation status.

  - name: stg_ror_embeddings
    description: Embeddings generated from ROR reference records.
    columns:
      - name: ror_id
        description: ROR identifier.
      - name: ror_display_name
        description: ROR display name.
      - name: ror_country_iso
        description: ROR country ISO code.
      - name: ror_country_name
        description: Standardized ROR country name.
      - name: content
        description: Text content used for embedding generation.
      - name: embedding
        description: Embedding vector output from BigQuery ML.
      - name: embedding_status
        description: Embedding generation status.

  - name: stg_ror_matches_vector_search
    description: Top-1 vector search matches between candidate and ROR embeddings.
    columns:
      - name: candidate_input
        description: Candidate embedding input text.
      - name: candidate_inst_name
        description: Candidate institution name.
      - name: candidate_country_iso
        description: Candidate country ISO code.
      - name: candidate_country
        description: Candidate country name.
      - name: ror_id
        description: Matched ROR identifier.
      - name: ror_name
        description: Matched ROR name.
      - name: ror_country_iso
        description: Matched ROR country ISO code.
      - name: ror_country
        description: Matched ROR country name.
      - name: cosine_similarity
        description: Similarity score between candidate and matched ROR embedding.
