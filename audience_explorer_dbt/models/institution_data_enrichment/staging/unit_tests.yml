unit_tests:
  - name: test_targets_fallback_logic_and_embedding_format
    model: stg_inst_enrichment_targets
    given:
      - input: source('prod_audience_explorer_analytics_dbt_presentation', 'audience_builder_big')
        rows:
          - {canonical_segment_id: 'CID_RESEARCHER', email: 'r_only@example.com', researcher_id: 'RID_1', snid: null, institution_name: null, mkt_pref_opt_in: true, is_legitimate_interest_author_opted_in: false}
          - {canonical_segment_id: 'CID_BOTH_IDS', email: 'both_ids@example.com', researcher_id: 'RID_2', snid: 'SNID_2', institution_name: null, mkt_pref_opt_in: true, is_legitimate_interest_author_opted_in: false}
          - {canonical_segment_id: 'CID_EMAIL_ONLY', email: 'author_only@example.com', researcher_id: null, snid: null, institution_name: null, mkt_pref_opt_in: true, is_legitimate_interest_author_opted_in: false}
          - {canonical_segment_id: 'CID_UNKNOWN_ISO', email: 'unknown_iso@example.com', researcher_id: 'RID_UNKNOWN_ISO', snid: null, institution_name: null, mkt_pref_opt_in: true, is_legitimate_interest_author_opted_in: false}
          - {canonical_segment_id: 'CID_NOT_ELIGIBLE', email: 'not_eligible@example.com', researcher_id: 'RID_3', snid: 'SNID_3', institution_name: null, mkt_pref_opt_in: false, is_legitimate_interest_author_opted_in: false}

      - input: ref('raw_authors_institutions')
        rows:
          - {author_email: 'author_only@example.com', raw_inst_name: 'Authors Institute', country_iso: 'GB', country_name: 'United Kingdom'}

      - input: ref('raw_crp_institutions')
        rows:
          - {researcher_id: 'RID_1', raw_inst_name: 'CRP Researcher Institute 1', country_iso: 'US', country_name: 'United States'}
          - {researcher_id: 'RID_2', raw_inst_name: 'CRP Researcher Institute 2', country_iso: 'DE', country_name: 'Germany'}
          - {researcher_id: 'RID_UNKNOWN_ISO', raw_inst_name: 'CRP Unknown ISO Institute', country_iso: 'ZZ', country_name: 'Unknownland'}
          - {researcher_id: 'RID_3', raw_inst_name: 'CRP Researcher Institute 3', country_iso: 'FR', country_name: 'France'}

      - input: ref('raw_crp_institutions_by_snid')
        rows:
          - {snid: 'SNID_2', raw_inst_name: 'CRP SNID Institute 2', country_iso: 'FR', country_name: 'France'}
          - {snid: 'SNID_3', raw_inst_name: 'CRP SNID Institute 3', country_iso: 'IT', country_name: 'Italy'}

      - input: ref('stg_iso_country_name')
        rows:
          - {iso_code: 'US', country_name: 'United States'}
          - {iso_code: 'DE', country_name: 'Germany'}
          - {iso_code: 'GB', country_name: 'United Kingdom'}

    expect:
      rows:
        - {canonical_segment_id: 'CID_RESEARCHER', raw_inst_name: 'CRP Researcher Institute 1', enrichment_source: 'CRP_by_researcher_id', embedding_input: 'CRP Researcher Institute 1, United States'}
        - {canonical_segment_id: 'CID_BOTH_IDS', raw_inst_name: 'CRP Researcher Institute 2', enrichment_source: 'CRP_by_researcher_id', embedding_input: 'CRP Researcher Institute 2, Germany'}
        - {canonical_segment_id: 'CID_EMAIL_ONLY', raw_inst_name: 'Authors Institute', enrichment_source: 'Authors', embedding_input: 'Authors Institute, United Kingdom'}
        - {canonical_segment_id: 'CID_UNKNOWN_ISO', raw_inst_name: 'CRP Unknown ISO Institute', enrichment_source: 'CRP_by_researcher_id', embedding_input: 'CRP Unknown ISO Institute'}

  - name: test_fallback_priority_logic_1to1_domain_wikidata
    description: |
      Test fallback priority logic with four enrichment branches.

      Priority order per canonical_segment_id:
      1) Vector 1-to-1 match (stg_ror_match_decisions)
      2) Domain fallback (stg_ror_domain_fallback_targets)
      3) WikiData ROR fallback (stg_wikidata_fallback_targets)
      4) WikiData name fallback for ROR-missing ids (stg_wikidata_names_fallback_targets)

      Scenario coverage:
      - CID_VECTOR_ONLY: has vector/domain/wiki -> vector (P1) must win.
      - CID_DOMAIN_PRIORITY: no valid vector; has domain + wiki -> domain (P2) must win.
      - CID_WIKI_FALLBACK: no vector/domain; has wiki + wikidata_name -> wiki_ror (P3) must win over wikidata_name (P4).
      - CID_WIKI_NAME_ONLY: only wikidata_name exists -> wikidata_name (P4) must be selected.
    
    model: institution_enriched_audience
    given:
      - input: ref('stg_inst_enrichment_targets')
        rows:
          # CID_VECTOR_ONLY: has raw inst name for embedding match
          - {canonical_segment_id: 'CID_VECTOR_ONLY', email: 'researcher@vector.edu', researcher_id: null, snid: null, raw_inst_name: 'Vector Research Institute', enrichment_source: 'CRP_by_researcher_id', country_iso: 'US', country_name: 'United States', embedding_input: 'Vector Research Institute, United States'}
          # CID_DOMAIN_PRIORITY: has embedding candidate but PARTIAL match (confidence < 1.0) - will be FILTERED OUT, then fallback to domain
          - {canonical_segment_id: 'CID_DOMAIN_PRIORITY', email: 'user@domain-only.edu', researcher_id: null, snid: null, raw_inst_name: 'Domain Priority Institute', enrichment_source: null, country_iso: 'UK', country_name: 'United Kingdom', embedding_input: 'Domain Priority Institute, United Kingdom'}
          # CID_WIKI_FALLBACK: no enrichment source (will fall back to wiki)
          - {canonical_segment_id: 'CID_WIKI_FALLBACK', email: 'scholar@wiki-only.org', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: null, country_iso: null, country_name: null, embedding_input: null}
          # CID_WIKI_NAME_ONLY: no vector/domain/wiki-ror result; should fallback to wikidata name targets (priority 4)
          - {canonical_segment_id: 'CID_WIKI_NAME_ONLY', email: 'nameonly@wikidata.org', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: null, country_iso: null, country_name: null, embedding_input: null}

      - input: ref('stg_ror_match_decisions')
        rows:
          # Only CID_VECTOR_ONLY has a 1-1 vector match (score = 1.0, status = '1 to 1 match')
          - {candidate_input: 'Vector Research Institute, United States', candidate_inst_name: 'Vector Research Institute', candidate_country: 'United States', candidate_country_iso: 'US', ror_id: 'ror.org/vector', ror_name: 'Vector University', ror_country: 'United States', ror_country_iso: 'US', cosine_similarity: 1.0, country_iso_match: true, match_status: '1 to 1 match'}
          # CID_DOMAIN_PRIORITY has PARTIAL vector match (score = 0.78, status != '1 to 1 match') - MODEL FILTERS THIS OUT - will fallback to domain
          - {candidate_input: 'Domain Priority Institute, United Kingdom', candidate_inst_name: 'Domain Priority Institute', candidate_country: 'United Kingdom', candidate_country_iso: 'UK', ror_id: 'ror.org/domain-partial', ror_name: 'Domain Partial Match', ror_country: 'United Kingdom', ror_country_iso: 'UK', cosine_similarity: 0.78, country_iso_match: true, match_status: 'needs_review'}

      - input: ref('stg_ror_domain_fallback_targets')
        rows:
          # CID_DOMAIN_PRIORITY gets enriched via email domain match (partial vector match was rejected, so domain wins)
          - {canonical_segment_id: 'CID_DOMAIN_PRIORITY', email: 'user@domain-only.edu', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'Domain_ROR_match', standardized_institution_name: 'Domain Matched University', ror_id: 'ror.org/domain', ror_country: 'UK'}
          # CID_VECTOR_ONLY also has domain match BUT should be ignored (1-1 takes priority)
          - {canonical_segment_id: 'CID_VECTOR_ONLY', email: 'researcher@vector.edu', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'Domain_ROR_match', standardized_institution_name: 'Vector Domain Fallback', ror_id: 'ror.org/vector-domain', ror_country: 'US'}

      - input: ref('stg_wikidata_fallback_targets')
        rows:
          # CID_WIKI_FALLBACK only has wiki enrichment (ultimate fallback)
          - {canonical_segment_id: 'CID_WIKI_FALLBACK', email: 'scholar@wiki-only.org', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'WikiData University', ror_id: 'ror.org/wiki', ror_country: 'France'}
          # CID_DOMAIN_PRIORITY also has wiki match BUT should be ignored (domain takes priority)
          - {canonical_segment_id: 'CID_DOMAIN_PRIORITY', email: 'user@domain-only.edu', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'Domain Wiki Fallback', ror_id: 'ror.org/domain-wiki', ror_country: 'UK'}
          # CID_VECTOR_ONLY also has wiki match BUT should be ignored (1-1 takes priority)
          - {canonical_segment_id: 'CID_VECTOR_ONLY', email: 'researcher@vector.edu', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'Vector Wiki Fallback', ror_id: 'ror.org/vector-wiki', ror_country: 'US'}

      - input: ref('stg_wikidata_names_fallback_targets')
        rows:
          # CID_WIKI_NAME_ONLY: no higher-priority match exists, so this branch should be selected
          - {canonical_segment_id: 'CID_WIKI_NAME_ONLY', email: 'nameonly@wikidata.org', researcher_id: null, snid: null, raw_inst_name: null, ror_id: 'ror.org/nameonly', standardized_institution_name: 'Wiki Name Only University', ror_country: null, enrichment_source: 'WIKIDATA_NAME'}
          # CID_WIKI_FALLBACK also has name fallback BUT should be ignored (wikidata_ror priority 3 wins over name priority 4)
          - {canonical_segment_id: 'CID_WIKI_FALLBACK', email: 'scholar@wiki-only.org', researcher_id: null, snid: null, raw_inst_name: null, ror_id: 'ror.org/wiki-name', standardized_institution_name: 'Wiki Name Backup', ror_country: null, enrichment_source: 'WIKIDATA_NAME'}

    expect:
      rows:
        # CID_VECTOR_ONLY: selected vector-enriched row; enrichment_source is inherited from target input row
        - {canonical_segment_id: 'CID_VECTOR_ONLY', enrichment_source: 'CRP_by_researcher_id', standardized_institution_name: 'Vector University', ror_id: 'ror.org/vector'}
        # CID_DOMAIN_PRIORITY: selected domain enrichment (medium priority, no 1-1 match)
        - {canonical_segment_id: 'CID_DOMAIN_PRIORITY', enrichment_source: 'Domain_ROR_match', standardized_institution_name: 'Domain Matched University', ror_id: 'ror.org/domain'}
        # CID_WIKI_FALLBACK: selected wiki enrichment (lowest priority fallback)
        - {canonical_segment_id: 'CID_WIKI_FALLBACK', enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'WikiData University', ror_id: 'ror.org/wiki'}
        # CID_WIKI_NAME_ONLY: selected wikidata-name fallback (priority 4) because no higher-priority match exists
        - {canonical_segment_id: 'CID_WIKI_NAME_ONLY', enrichment_source: 'WIKIDATA_NAME', standardized_institution_name: 'Wiki Name Only University', ror_id: 'ror.org/nameonly'}
