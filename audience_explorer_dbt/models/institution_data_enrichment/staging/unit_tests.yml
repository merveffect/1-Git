unit_tests:
  - name: test_targets_fallback_logic_and_embedding_format
    model: stg_inst_enrichment_targets
    given:
      - input: source('prod_audience_explorer_analytics_dbt_presentation', 'audience_builder_big')
        rows:
          - {canonical_segment_id: 'CID_RESEARCHER', email: 'r_only@example.com', researcher_id: 'RID_1', snid: null, institution_name: null, mkt_pref_opt_in: true, is_legitimate_interest_author_opted_in: false}
          - {canonical_segment_id: 'CID_BOTH_IDS', email: 'both_ids@example.com', researcher_id: 'RID_2', snid: 'SNID_2', institution_name: null, mkt_pref_opt_in: true, is_legitimate_interest_author_opted_in: false}
          - {canonical_segment_id: 'CID_EMAIL_ONLY', email: 'author_only@example.com', researcher_id: null, snid: null, institution_name: null, mkt_pref_opt_in: true, is_legitimate_interest_author_opted_in: false}
          - {canonical_segment_id: 'CID_UNKNOWN_ISO', email: 'unknown_iso@example.com', researcher_id: 'RID_UNKNOWN_ISO', snid: null, institution_name: null, mkt_pref_opt_in: true, is_legitimate_interest_author_opted_in: false}
          - {canonical_segment_id: 'CID_NOT_ELIGIBLE', email: 'not_eligible@example.com', researcher_id: 'RID_3', snid: 'SNID_3', institution_name: null, mkt_pref_opt_in: false, is_legitimate_interest_author_opted_in: false}

      - input: ref('raw_authors_institutions')
        rows:
          - {author_email: 'author_only@example.com', raw_inst_name: 'Authors Institute', country_iso: 'GB', country_name: 'United Kingdom'}

      - input: ref('raw_crp_institutions')
        rows:
          - {researcher_id: 'RID_1', raw_inst_name: 'CRP Researcher Institute 1', country_iso: 'US', country_name: 'United States'}
          - {researcher_id: 'RID_2', raw_inst_name: 'CRP Researcher Institute 2', country_iso: 'DE', country_name: 'Germany'}
          - {researcher_id: 'RID_UNKNOWN_ISO', raw_inst_name: 'CRP Unknown ISO Institute', country_iso: 'ZZ', country_name: 'Unknownland'}
          - {researcher_id: 'RID_3', raw_inst_name: 'CRP Researcher Institute 3', country_iso: 'FR', country_name: 'France'}

      - input: ref('raw_crp_institutions_by_snid')
        rows:
          - {snid: 'SNID_2', raw_inst_name: 'CRP SNID Institute 2', country_iso: 'FR', country_name: 'France'}
          - {snid: 'SNID_3', raw_inst_name: 'CRP SNID Institute 3', country_iso: 'IT', country_name: 'Italy'}

      - input: ref('stg_iso_country_name')
        rows:
          - {iso_code: 'US', country_name: 'United States'}
          - {iso_code: 'DE', country_name: 'Germany'}
          - {iso_code: 'GB', country_name: 'United Kingdom'}

    expect:
      rows:
        - {canonical_segment_id: 'CID_RESEARCHER', raw_inst_name: 'CRP Researcher Institute 1', enrichment_source: 'CRP_by_researcher_id', embedding_input: 'CRP Researcher Institute 1, United States'}
        - {canonical_segment_id: 'CID_BOTH_IDS', raw_inst_name: 'CRP Researcher Institute 2', enrichment_source: 'CRP_by_researcher_id', embedding_input: 'CRP Researcher Institute 2, Germany'}
        - {canonical_segment_id: 'CID_EMAIL_ONLY', raw_inst_name: 'Authors Institute', enrichment_source: 'Authors', embedding_input: 'Authors Institute, United Kingdom'}
        - {canonical_segment_id: 'CID_UNKNOWN_ISO', raw_inst_name: 'CRP Unknown ISO Institute', enrichment_source: 'CRP_by_researcher_id', embedding_input: 'CRP Unknown ISO Institute'}

  - name: test_fallback_priority_logic
    description: |
      Test fallback priority logic with three enrichment branches.

      Priority order per canonical_segment_id:
      1) Vector 1-to-1 match (stg_ror_match_decisions)
      2) Domain fallback (stg_ror_domain_fallback_targets)
      3) WikiData ROR fallback (stg_wikidata_fallback_targets)

      Scenario coverage:
      - CID_VECTOR_ONLY: has vector/domain/wiki -> vector (P1) must win.
      - CID_DOMAIN_PRIORITY: no valid vector; has domain + wiki -> domain (P2) must win.
      - CID_WIKI_FALLBACK: no vector/domain; has wiki -> wiki_ror (P3) must be selected.
    
    model: int_institution_enriched_audience_base
    given:
      - input: ref('stg_inst_enrichment_targets')
        rows:
          - {canonical_segment_id: 'CID_VECTOR_ONLY', email: 'researcher@vector.edu', researcher_id: null, snid: null, raw_inst_name: 'Vector Research Institute', enrichment_source: 'CRP_by_researcher_id', country_iso: 'US', country_name: 'United States', embedding_input: 'Vector Research Institute, United States'}
          - {canonical_segment_id: 'CID_DOMAIN_PRIORITY', email: 'user@domain-only.edu', researcher_id: null, snid: null, raw_inst_name: 'Domain Priority Institute', enrichment_source: null, country_iso: 'UK', country_name: 'United Kingdom', embedding_input: 'Domain Priority Institute, United Kingdom'}
          - {canonical_segment_id: 'CID_WIKI_FALLBACK', email: 'scholar@wiki-only.org', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: null, country_iso: null, country_name: null, embedding_input: null}
          - {canonical_segment_id: 'CID_EBM_WINS', email: 'ebm@example.edu', researcher_id: null, snid: 'SNID_EBM', raw_inst_name: null, enrichment_source: 'EBM', country_iso: null, country_name: null, embedding_input: null}

      - input: ref('stg_ror_ebm_enrichment_targets')
        rows:
          - {canonical_segment_id: 'CID_EBM_WINS', email: 'ebm@example.edu', researcher_id: null, snid: 'SNID_EBM', raw_inst_name: null, enrichment_source: 'EBM', standardized_institution_name: 'EBM University', ror_id: 'ror.org/ebm', ror_country: 'United States'}

      - input: ref('stg_ror_vector_enriched_targets')
        rows:
          - {canonical_segment_id: 'CID_VECTOR_ONLY', email: 'researcher@vector.edu', researcher_id: null, snid: null, raw_inst_name: 'Vector Research Institute', enrichment_source: 'CRP_by_researcher_id', standardized_institution_name: 'Vector University', ror_id: 'ror.org/vector', ror_country: 'United States'}
          - {canonical_segment_id: 'CID_EBM_WINS', email: 'ebm@example.edu', researcher_id: null, snid: 'SNID_EBM', raw_inst_name: null, enrichment_source: 'EBM', standardized_institution_name: 'EBM Vector Fallback', ror_id: 'ror.org/ebm-vector', ror_country: 'United States'}

      - input: ref('stg_ror_match_decisions')
        rows:
          - {candidate_input: 'Vector Research Institute, United States', candidate_inst_name: 'Vector Research Institute', candidate_country: 'United States', candidate_country_iso: 'US', ror_id: 'ror.org/vector', ror_name: 'Vector University', ror_country: 'United States', ror_country_iso: 'US', cosine_similarity: 1.0, country_iso_match: true, match_status: '1 to 1 match'}
          - {candidate_input: 'Domain Priority Institute, United Kingdom', candidate_inst_name: 'Domain Priority Institute', candidate_country: 'United Kingdom', candidate_country_iso: 'UK', ror_id: 'ror.org/domain-partial', ror_name: 'Domain Partial Match', ror_country: 'United Kingdom', ror_country_iso: 'UK', cosine_similarity: 0.78, country_iso_match: true, match_status: 'needs_review'}

      - input: ref('stg_ror_domain_fallback_targets')
        rows:
          - {canonical_segment_id: 'CID_DOMAIN_PRIORITY', email: 'user@domain-only.edu', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'Domain_ROR_match', standardized_institution_name: 'Domain Matched University', ror_id: 'ror.org/domain', ror_country: 'UK'}
          - {canonical_segment_id: 'CID_VECTOR_ONLY', email: 'researcher@vector.edu', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'Domain_ROR_match', standardized_institution_name: 'Vector Domain Fallback', ror_id: 'ror.org/vector-domain', ror_country: 'US'}
          - {canonical_segment_id: 'CID_EBM_WINS', email: 'ebm@example.edu', researcher_id: null, snid: 'SNID_EBM', raw_inst_name: null, enrichment_source: 'Domain_ROR_match', standardized_institution_name: 'EBM Domain Fallback', ror_id: 'ror.org/ebm-domain', ror_country: 'United States'}

      - input: ref('stg_wikidata_fallback_targets')
        rows:
          - {canonical_segment_id: 'CID_WIKI_FALLBACK', email: 'scholar@wiki-only.org', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'WikiData University', ror_id: 'ror.org/wiki', ror_country: 'France'}
          - {canonical_segment_id: 'CID_DOMAIN_PRIORITY', email: 'user@domain-only.edu', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'Domain Wiki Fallback', ror_id: 'ror.org/domain-wiki', ror_country: 'UK'}
          - {canonical_segment_id: 'CID_VECTOR_ONLY', email: 'researcher@vector.edu', researcher_id: null, snid: null, raw_inst_name: null, enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'Vector Wiki Fallback', ror_id: 'ror.org/vector-wiki', ror_country: 'US'}

    expect:
      rows:
        - {canonical_segment_id: 'CID_EBM_WINS', enrichment_source: 'EBM', standardized_institution_name: 'EBM University', ror_id: 'ror.org/ebm'}
        - {canonical_segment_id: 'CID_VECTOR_ONLY', enrichment_source: 'CRP_by_researcher_id', standardized_institution_name: 'Vector University', ror_id: 'ror.org/vector'}
        - {canonical_segment_id: 'CID_DOMAIN_PRIORITY', enrichment_source: 'Domain_ROR_match', standardized_institution_name: 'Domain Matched University', ror_id: 'ror.org/domain'}
        - {canonical_segment_id: 'CID_WIKI_FALLBACK', enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'WikiData University', ror_id: 'ror.org/wiki'}

  - name: test_ebm_latest_affiliation
    description: |
      Tests that stg_ror_ebm_enrichment picks the LATEST affiliation per snid.
    model: stg_ror_ebm_enrichment
    given:
      - input: ref('raw_ebm_data')
        format: sql
        rows: |
          select
            [struct('SNID_MULTI' as snid)] as individual_contact,
            [
              struct('https://ror.org/old' as institution_ror_id, timestamp '2020-01-01' as affiliation_start_date),
              struct('https://ror.org/new' as institution_ror_id, timestamp '2023-01-01' as affiliation_start_date)
            ] as individual_affiliation

      - input: ref('stg_ror')
        rows:
          - {ror_id: 'https://ror.org/old', ror_display_name: 'Old University', ror_country_name: 'United States'}
          - {ror_id: 'https://ror.org/new', ror_display_name: 'New University', ror_country_name: 'Germany'}

    expect:
      rows:
        - {snid: 'SNID_MULTI', ror_id: 'https://ror.org/new', standardized_institution_name: 'New University', ror_country: 'Germany', enrichment_source: 'EBM'}

  - name: test_ror_domains_generic_and_reject
    description: |
      Tests stg_ror_domains filtering logic:
      1. Generic domains (e.g. gmail.com) must be excluded via is_generic_domain macro.
      2. Domains associated with more than one ROR ID must be rejected (ambiguous).
      3. A clean domain mapped to a single institution must pass through.
    model: stg_ror_domains
    given:
      - input: ref('stg_ror')
        rows:
          # clean domain -> single institution (should PASS)
          - {ror_id: 'https://ror.org/clean', ror_display_name: 'Clean University', ror_country_name: 'United States', domains: ['clean-uni.edu']}
          # generic domain (should be EXCLUDED by is_generic_domain)
          - {ror_id: 'https://ror.org/generic', ror_display_name: 'Generic Institute', ror_country_name: 'Germany', domains: ['gmail.com']}
          # ambiguous domain: same domain on two different institutions (should be REJECTED)
          - {ror_id: 'https://ror.org/ambig1', ror_display_name: 'Ambiguous One', ror_country_name: 'France', domains: ['shared.edu']}
          - {ror_id: 'https://ror.org/ambig2', ror_display_name: 'Ambiguous Two', ror_country_name: 'Italy', domains: ['shared.edu']}

    expect:
      rows:
        # only the clean domain survives; generic excluded, ambiguous rejected
        - {domain: 'clean-uni.edu', ror_id: 'https://ror.org/clean', ror_name: 'Clean University', ror_country: 'United States'}


  - name: test_authors_latest_submission
    description: |
      Tests that raw_authors_institutions picks the LATEST institution per author
      by submission_date. When an author has multiple submissions with different
      institutions, only the most recent one must be returned.
      
    model: raw_authors_institutions
    given:
      - input: source('prod_joint_submissions_core', 'authors')
        rows:
          - {author_email: 'moved@example.com', submission_id: 'SUB_OLD', institute: 'Old University', author_country: 'United States', author_country_iso_code: 'US'}
          - {author_email: 'moved@example.com', submission_id: 'SUB_NEW', institute: 'New University', author_country: 'Germany', author_country_iso_code: 'DE'}
          - {author_email: 'single@example.com', submission_id: 'SUB_X', institute: 'Single University', author_country: 'France', author_country_iso_code: 'FR'}

      - input: source('prod_joint_submissions_core', 'submissions')
        rows:
          - {submission_id: 'SUB_OLD', submission_date: '2020-01-01'}
          - {submission_id: 'SUB_NEW', submission_date: '2023-01-01'}
          - {submission_id: 'SUB_X', submission_date: '2021-06-15'}

    expect:
      rows:
        # moved@example.com -> latest submission (2023) wins -> New University
        - {author_email: 'moved@example.com', raw_inst_name: 'New University', country_name: 'Germany', country_iso: 'DE'}
        # single@example.com -> only one submission
        - {author_email: 'single@example.com', raw_inst_name: 'Single University', country_name: 'France', country_iso: 'FR'}



  - name: test_history_change_detection
    description: |
      Tests the append-only change-detection logic of int_institution_enriched_history.

      Given an existing history (the `this` table) with prior records, and a new
      base run, the model must:
        - ADD a brand-new user (not in history yet)
        - NOT add a user whose enrichment is unchanged (no data bloat)
        - ADD a user whose institution name / ror_id / source changed (change captured)

      This runs in incremental mode (overrides is_incremental = true) so the
      change-detection branch is exercised.
    model: int_institution_enriched_history
    overrides:
      macros:
        is_incremental: true
    given:
      # the base model output for THIS run
      - input: ref('int_institution_enriched_audience_base')
        rows:
          # NEW user - not in history yet -> must be ADDED
          - {canonical_segment_id: 'CID_NEW', email: 'new@example.com', researcher_id: null, snid: null, original_raw_name: 'New Uni', enrichment_source: 'EBM', standardized_institution_name: 'New University', ror_id: 'ror.org/new', ror_country: 'Germany'}
          # UNCHANGED user - same institution as latest history -> must NOT be added
          - {canonical_segment_id: 'CID_SAME', email: 'same@example.com', researcher_id: null, snid: null, original_raw_name: 'Same Uni', enrichment_source: 'EBM', standardized_institution_name: 'Same University', ror_id: 'ror.org/same', ror_country: 'France'}
          # CHANGED user - institution name differs from latest history -> must be ADDED
          - {canonical_segment_id: 'CID_CHANGED', email: 'changed@example.com', researcher_id: null, snid: null, original_raw_name: 'Changed Uni', enrichment_source: 'Domain_ROR_match', standardized_institution_name: 'New Institution Name', ror_id: 'ror.org/changed-new', ror_country: 'Italy'}

      # the existing history table (this)
      - input: this
        rows:
          # CID_SAME already has this exact institution (latest) -> new run is unchanged
          - {canonical_segment_id: 'CID_SAME', email: 'same@example.com', researcher_id: null, snid: null, original_raw_name: 'Same Uni', enrichment_source: 'EBM', standardized_institution_name: 'Same University', ror_id: 'ror.org/same', ror_country: 'France', enrichment_timestamp: '2024-01-01 00:00:00'}
          # CID_CHANGED previously had a DIFFERENT institution -> new run is a change
          - {canonical_segment_id: 'CID_CHANGED', email: 'changed@example.com', researcher_id: null, snid: null, original_raw_name: 'Changed Uni', enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'Old Institution Name', ror_id: 'ror.org/changed-old', ror_country: 'Italy', enrichment_timestamp: '2024-01-01 00:00:00'}

    expect:
      rows:
        # only NEW and CHANGED users are added; SAME is filtered out (no bloat)
        - {canonical_segment_id: 'CID_NEW', standardized_institution_name: 'New University', enrichment_source: 'EBM', ror_id: 'ror.org/new'}
        - {canonical_segment_id: 'CID_CHANGED', standardized_institution_name: 'New Institution Name', enrichment_source: 'Domain_ROR_match', ror_id: 'ror.org/changed-new'}


  - name: test_final_latest_selection
    description: |
      Tests that institution_enriched_audience returns exactly one row per user -
      the latest enrichment by enrichment_timestamp - from validated enrichment rows.

      CID_MULTI has two valid records (an older and a newer institution).
      The final model must return only the newer one.
      CID_SINGLE has one valid record and must pass through unchanged.
    model: institution_enriched_audience
    given:
      - input: ref('int_institution_enriched_valid')
        rows:
          # CID_MULTI: two records, different timestamps -> latest (2024-06) must win
          - {canonical_segment_id: 'CID_MULTI', email: 'multi@example.com', researcher_id: null, snid: null, original_raw_name: 'Old Uni', enrichment_source: 'WIKIDATA_ROR_NAME', standardized_institution_name: 'Old University', ror_id: 'ror.org/old', ror_country: 'France', enrichment_timestamp: '2024-01-01 00:00:00'}
          - {canonical_segment_id: 'CID_MULTI', email: 'multi@example.com', researcher_id: null, snid: null, original_raw_name: 'New Uni', enrichment_source: 'EBM', standardized_institution_name: 'New University', ror_id: 'ror.org/new', ror_country: 'Germany', enrichment_timestamp: '2024-06-01 00:00:00'}
          # CID_SINGLE: only one record -> passes through
          - {canonical_segment_id: 'CID_SINGLE', email: 'single@example.com', researcher_id: null, snid: null, original_raw_name: 'Single Uni', enrichment_source: 'Authors', standardized_institution_name: 'Single University', ror_id: 'ror.org/single', ror_country: 'Italy', enrichment_timestamp: '2024-03-01 00:00:00'}

    expect:
      rows:
        # CID_MULTI -> latest record (2024-06, New University) only
        - {canonical_segment_id: 'CID_MULTI', standardized_institution_name: 'New University', enrichment_source: 'EBM', ror_id: 'ror.org/new'}
        # CID_SINGLE -> only record passes through
        - {canonical_segment_id: 'CID_SINGLE', standardized_institution_name: 'Single University', enrichment_source: 'Authors', ror_id: 'ror.org/single'}