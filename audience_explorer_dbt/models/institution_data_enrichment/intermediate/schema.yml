version: 2

models:
  - name: int_institution_enriched_audience_base
    description: |
      Base enrichment model (recomputed each run).
      Combines prioritized enrichment outputs and keeps one best record per email.
    columns:
      - name: email
        description: Unique person-level identifier for intermediate enrichment output.
        data_tests:
          - not_null
          - unique
      - name: canonical_segment_id
        description: Segment identifier from source systems; not unique and can map to multiple emails.
      - name: researcher_id
        description: Researcher identifier when available.
      - name: snid
        description: SNID when available.
      - name: original_raw_name
        description: Raw institution name before standardization.
      - name: enrichment_source
        description: Source used for enrichment (EBM, Authors, CRP, domain, or WikiData fallback).
      - name: standardized_institution_name
        description: Standardized institution name selected for the user.
      - name: ror_id
        description: Resolved ROR identifier for the selected institution.
      - name: ror_country
        description: Country information for the resolved ROR record.

  - name: int_institution_enriched_history
    description: |
      Append-only enrichment history. Adds rows for new users or changed enrichment values.
    columns:
      - name: email
        description: Email key for the historical enrichment row (not unique in history because rows are append-only over time).
      - name: canonical_segment_id
        description: Segment identifier from source systems; not unique and can map to multiple emails.
      - name: researcher_id
        description: Researcher identifier when available.
      - name: snid
        description: SNID when available.
      - name: original_raw_name
        description: Raw institution name captured for this historical row.
      - name: enrichment_source
        description: Source that produced this enrichment row.
      - name: standardized_institution_name
        description: Standardized institution name at this history version.
      - name: ror_id
        description: ROR identifier at this history version.
      - name: ror_country
        description: ROR country at this history version.
      - name: enrichment_timestamp
        description: Timestamp when this history row was created.

  - name: int_institution_enriched_valid
    description: |
      Validated enrichment rows from history after source-availability checks, deduplicated to one row per email.
    columns:
      - name: email
        description: Unique person-level identifier for validated intermediate enrichment.
        data_tests:
          - not_null
          - unique
      - name: canonical_segment_id
        description: Segment identifier from source systems; not unique and can map to multiple emails.
      - name: researcher_id
        description: Researcher identifier when available.
      - name: snid
        description: SNID when available.
      - name: original_raw_name
        description: Raw institution name before standardization.
      - name: enrichment_source
        description: Enrichment source retained after validity checks.
      - name: standardized_institution_name
        description: Standardized institution name retained after validity checks.
      - name: ror_id
        description: ROR identifier retained after validity checks.
      - name: ror_country
        description: ROR country retained after validity checks.
      - name: enrichment_timestamp
        description: Timestamp of the historical enrichment row.

 