unit_tests:
  - name: test_tld_generation_logic
    model: stg_country_enrichment_mapping_location_data
    given:
      - input: ref('raw_full_location_standard') 
        rows:
          - {alpha_2_code: 'GB', code_status: 'Current', springer_nature_data_standard_location_name: 'United Kingdom'}
          - {alpha_2_code: 'US', code_status: 'Current', springer_nature_data_standard_location_name: 'United States'}
          - {alpha_2_code: 'DE', code_status: 'Deprecated', springer_nature_data_standard_location_name: 'Germany'}
    expect:
      rows:
        - {alpha_2_code: 'GB', generated_tld: '.uk', standard_name: 'United Kingdom'}
        - {alpha_2_code: 'US', generated_tld: '.us', standard_name: 'United States'}


  - name: test_email_parsing_logic
    model: stg_country_enrichment_tld_extract
    given:
      - input: ref('audience_builder_big')
        rows:
          # Scenario 1: Academic email (Crucial for Tier 3 ROR)
          - {email: 'researcher@ox.ac.uk', mkt_pref_opt_in: true, canonical_segment_id: 'ID_1'}
          # Scenario 2: Standard commercial email (Crucial for Tier 2 TLD)
          - {email: 'user@gmail.com', mkt_pref_opt_in: true, canonical_segment_id: 'ID_2'}

    expect:
      rows:
        - {canonical_segment_id: 'ID_1', email_domain: 'ox.ac.uk', extracted_tld: '.uk'}
        - {canonical_segment_id: 'ID_2', email_domain: 'gmail.com', extracted_tld: '.com'}


  - name: test_enrichment_priority_logic
    model: stg_country_enrichment_matches
    overrides:
     macros:
      is_incremental: false
    given:
      # Priority: TLD -> ROR -> IP -> UNKNOWN. No existing country is used as input.
      - input: ref('stg_country_enrichment_tld_extract')
        rows:
          - {canonical_segment_id: 'USER_1', extracted_tld: '.uk', email_domain: 'ox.ac.uk', most_seen_ip_country: 'tr'}
          - {canonical_segment_id: 'USER_2', extracted_tld: '.fr', email_domain: 'test.fr', most_seen_ip_country: 'us'}
          - {canonical_segment_id: 'USER_3', extracted_tld: null,  email_domain: 'lara.lender@whu.edu', most_seen_ip_country: 'jp'}
          - {canonical_segment_id: 'USER_4', extracted_tld: null,  email_domain: null,      most_seen_ip_country: 'it'}
          - {canonical_segment_id: 'USER_5', extracted_tld: null,  email_domain: null,      most_seen_ip_country: null}

      - input: ref('stg_country_enrichment_mapping_location_data')
        rows:
          - {generated_tld: '.uk', standard_name: 'United Kingdom', alpha_2_code: 'GB'}
          - {generated_tld: '.fr', standard_name: 'France',         alpha_2_code: 'FR'}
          - {generated_tld: null,  standard_name: 'Japan',          alpha_2_code: 'JP'}
          - {generated_tld: null,  standard_name: 'Italy',          alpha_2_code: 'IT'}
          # Germany row needed for ROR iso lookup
          - {generated_tld: '.de', standard_name: 'Germany',        alpha_2_code: 'DE'}

      - input: ref('stg_country_enrichment_ror_data')
        rows:
          - {domain: 'ox.ac.uk', ror_country: 'United Kingdom'}
          - {domain: 'lara.lender@whu.edu',  ror_country: 'Germany'}

    expect:
      rows:
        # USER_1: TLD, ROR and IP all available. TLD (.uk -> United Kingdom) must win. ISO: GB
        - {canonical_segment_id: 'USER_1', calculated_country: 'United Kingdom', enrichment_source: 'TLD', is_enriched: true, iso_code: 'GB'}
        # USER_2: TLD (.fr -> France) must win over IP. ISO: FR
        - {canonical_segment_id: 'USER_2', calculated_country: 'France',  enrichment_source: 'TLD', is_enriched: true, iso_code: 'FR'}
        # USER_3: No TLD match. ROR (lara.lender@whu.edu -> Germany) must win over IP. ISO: DE
        - {canonical_segment_id: 'USER_3', calculated_country: 'Germany', enrichment_source: 'ROR', is_enriched: true, iso_code: 'DE'}
        # USER_4: Only IP available. IP (it -> Italy) must win. ISO: IT
        - {canonical_segment_id: 'USER_4', calculated_country: 'Italy',   enrichment_source: 'IP', is_enriched: true, iso_code: 'IT'}
        # USER_5: No signal at all. UNKNOWN, not enriched.
        - {canonical_segment_id: 'USER_5', calculated_country: null,      enrichment_source: 'UNKNOWN', is_enriched: false, iso_code: null}


  - name: test_is_enriched_logic
    model: stg_country_enrichment_matches
    overrides:
     macros:
      is_incremental: false
    given:
      - input: ref('stg_country_enrichment_tld_extract')
        rows:
          # Enriched case with TLD match
          - {canonical_segment_id: 'ID_1', extracted_tld: '.uk'}
          # Non-enriched case: no TLD, ROR or IP match -> UNKNOWN
          - {canonical_segment_id: 'ID_2', extracted_tld: '.xx'}
      
      - input: ref('stg_country_enrichment_mapping_location_data')
        rows:
          - {generated_tld: '.uk', standard_name: 'United Kingdom', alpha_2_code: 'GB'}
          - {generated_tld: '.de', standard_name: 'Germany',        alpha_2_code: 'DE'}

      - input: ref('stg_country_enrichment_ror_data')
        rows:
          - {domain: 'example.edu', ror_country: 'United States'}

    expect:
      rows:
        - {canonical_segment_id: 'ID_1', enrichment_source: 'TLD', is_enriched: true, iso_code: 'GB'}
        - {canonical_segment_id: 'ID_2', enrichment_source: 'UNKNOWN', is_enriched: false, iso_code: null}


  - name: test_final_email_dedup_prioritizes_known_users
    model: stg_country_enrichment_final_email_dedup
    given:
      - input: ref('stg_country_enrichment_matches')
        rows:
          - {canonical_segment_id: 'CID_A', iso_code: 'GB', calculated_country: 'United Kingdom', enrichment_source: 'TLD', is_enriched: true, enrichment_timestamp: '2026-06-09 10:00:00'}
          - {canonical_segment_id: 'CID_B', iso_code: 'US', calculated_country: 'United States', enrichment_source: 'IP', is_enriched: true, enrichment_timestamp: '2026-06-09 10:00:00'}
          - {canonical_segment_id: 'CID_C', iso_code: 'DE', calculated_country: 'Germany', enrichment_source: 'TLD', is_enriched: true, enrichment_timestamp: '2026-06-09 10:00:00'}

      - input: ref('audience_builder_big')
        rows:
          - {canonical_segment_id: 'CID_A', snid: 'S_A', email: 'dup@example.com', mkt_pref_opt_in: true}
          - {canonical_segment_id: 'CID_B', snid: 'S_B', email: 'dup@example.com', mkt_pref_opt_in: true}
          - {canonical_segment_id: 'CID_C', snid: 'S_C', email: 'single@example.com', mkt_pref_opt_in: true}

      - input: source('prod_cdi_presentation','segment_known_users_with_email')
        rows:
          - {segment_id: 'CID_B', email: 'dup@example.com'}

    expect:
      rows:
        - {canonical_segment_id: 'CID_B', snid: 'S_B', email: 'dup@example.com', iso_code: 'US', country: 'United States', enrichment_source: 'IP', is_enriched: true, last_enriched_at: '2026-06-09 10:00:00'}
        - {canonical_segment_id: 'CID_C', snid: 'S_C', email: 'single@example.com', iso_code: 'DE', country: 'Germany', enrichment_source: 'TLD', is_enriched: true, last_enriched_at: '2026-06-09 10:00:00'}


  # Regression test for the ORIGINAL_DATA bug:
  # - A user whose last record is ORIGINAL_DATA (e.g. after a canonical_segment_id change)
  #   must now get an enriched record.
  # - A user whose enrichment did not change must not get a new history row.
  - name: test_incremental_former_original_data_gets_enriched
    model: stg_country_enrichment_matches
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {canonical_segment_id: 'USER_FORMER_ORIGINAL', enrichment_source: 'ORIGINAL_DATA', calculated_country: 'Indonesia', iso_code: 'ID', enrichment_timestamp: '2026-09-08 08:00:00'}
          - {canonical_segment_id: 'USER_UNCHANGED', enrichment_source: 'TLD', calculated_country: 'United Kingdom', iso_code: 'GB', enrichment_timestamp: '2026-09-08 08:00:00'}

      - input: ref('stg_country_enrichment_tld_extract')
        rows:
          - {canonical_segment_id: 'USER_FORMER_ORIGINAL', extracted_tld: '.id', email_domain: 'umma.ac.id', most_seen_ip_country: 'ID'}
          - {canonical_segment_id: 'USER_UNCHANGED', extracted_tld: '.uk', email_domain: 'ox.ac.uk', most_seen_ip_country: null}

      - input: ref('stg_country_enrichment_mapping_location_data')
        rows:
          - {generated_tld: '.id', standard_name: 'Indonesia', alpha_2_code: 'ID'}
          - {generated_tld: '.uk', standard_name: 'United Kingdom', alpha_2_code: 'GB'}

      - input: ref('stg_country_enrichment_ror_data')
        rows:
          - {domain: 'dummy.edu', ror_country: 'United States'}

    expect:
      rows:
        # Only the former ORIGINAL_DATA user gets a new row; the unchanged user is filtered out by change detection.
        - {canonical_segment_id: 'USER_FORMER_ORIGINAL', enrichment_source: 'TLD', calculated_country: 'Indonesia', is_enriched: true, iso_code: 'ID'}