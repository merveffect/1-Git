        +schema: "country_data_enrichment_raw"
        +materialized: table
        +tags: country_enrichment_raw

      staging:
        +schema: "country_data_enrichment_staging"
        +materialized: table
        +tags: country_enrichment_staging

      presentation:
        +schema: "country_data_enrichment_presentation"
        +materialized: table
        +tags: country_enrichment_presentation

    institution_data_enrichment:
      +schema: "analytics_dbt_institution_data_enrichment"
      +materialized: table
      +tags: institution_data_enrichment
      raw:
        +schema: "institution_data_enrichment_raw"
