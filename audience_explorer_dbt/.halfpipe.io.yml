team: dat-analytics-engineering
pipeline: audience_explorer_dbt
notifications:
  failure:
  - teams: ((TEAMS.WORKFLOW_URL))
  - message: "Audience Explorer DBT pipeline failed :warning:"
dbt_target: poc
feature_toggles:
  - update-pipeline

triggers:
  - type: git
    uri: git@github.com:springernature/analytics_engineering_dbt.git
    branch: main
    watched_paths:
      - audience_explorer_dbt

tasks:
  - type: run
    name: deploy-dev
    script: \sndbt deploy --verbose
    docker:
      image: eu.gcr.io/halfpipe-io/sn-dbt-0.2
    vars:
      GCP_PROJECT: snproject-cbb9ca25
      GCP_SERVICE_ACCOUNT_INFO: ((dev.dbt_deployer_service_account))
      SNDBT_CONFIG_FILE: dbt-deploy-dev.yml

  - type: run
    name: deploy-prod
    notifications:
    failure:
    - teams: '((TEAMS.WORKFLOW_URL))'
      message: "Audience Explorer DBT PROD deployment failed :warning:"
      status: "failed"
    script: \sndbt deploy --verbose
    docker:
      image: eu.gcr.io/halfpipe-io/sn-dbt-0.2
    vars:
      GCP_PROJECT: snproject-cbb9ca25 
      GCP_SERVICE_ACCOUNT_INFO: ((prod.dbt_deployer_service_account))
      SNDBT_CONFIG_FILE: dbt-deploy-prod.yml
