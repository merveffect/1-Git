version: 2

models:
  - name: int_title_distinct
    description: Distinct titles and frequencies. All expensive work runs on this.
    columns:
      - name: title_key
        tests: [unique, not_null]
      - name: frequency
        tests: [not_null]

  - name: int_anchor_terms
    description: >
      Anchor terms per role (seed + ESCO), plus the '__distractor'
      pseudo-role holding common non-target occupations.

  - name: int_org_resolved
    description: >
      Organisation resolution via three routes: ROR id, external id
      bridge (RINGGOLD / GRID / FUNDREF), then name matching.
    columns:
      - name: resolution_method
        tests:
          - not_null

  - name: dim_title_group
    description: >
      ⭐ DICTIONARY 1. One row per distinct job title, mapped to a position
      group. Human overrides always win. No AI runs downstream of this.
    columns:
      - name: title_key
        tests: [unique, not_null]
      - name: group_score
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: decision_source
        tests:
          - accepted_values:
              arguments:
                values: ['HUMAN', 'PATTERN', 'VECTOR', 'REJECTED']
      - name: title_group_2
        description: >
          ⭐ THE SECOND GROUP, where the title names two jobs. Merve,
          2026-11-11, reversing 1.10a: a title belonged to exactly one
          profession, and that single constraint sorted 68,000 records by
          punctuation - `professor and director` reached Head of Faculty
          while `professor & director` reached Lecturer.

          Null for almost every title. Where it is set, the person qualifies
          for the audiences of BOTH groups: int_employment_scored tests this
          column alongside title_group in every role's membership filter, and
          role_score comes from whichever one matched.

          The rules are in seeds/title_group_second.csv and are scoped to the
          RESOLVED group rather than the model's guess, so an override moving
          a title also moves which second-group rules can see it.
        tests:
          - relationships:
              arguments:
                to: ref('int_title_group_registry')
                field: title_group
      - name: group_2_score
        description: >
          1.0 wherever title_group_2 is set, null otherwise. A second group
          only ever comes from a literal pattern match, and a literal match
          is not a guess - the same reasoning that gives pattern_hits a score
          of 1.0 in the primary column.

          Deliberately NOT used in preference to group_score: a title that
          qualifies for a role on both columns carries its primary graded
          score, because taking the flat 1.0 would quietly inflate every
          compound title's final score.
      - name: model_title_group
        description: >
          The group the embedding model chose, before any override or
          pattern. Kept so the precedence chain is auditable, and so a
          pattern scoped with applies_when_title_group can be tested - both
          pattern assertions join back to this model, and matching on the
          resolved title_group would be circular once a pattern has fired.
      - name: model_is_assigned
        description: >
          Whether the model's own choice cleared sim_floor. A pattern scoped
          with applies_when_title_group fires only where this is true, so
          that conditioning on a group never rescues a title the floor had
          rejected. Exposed for the same reason as model_title_group: the
          two pattern assertions have to be able to ask the model's
          question, not a different one.

  - name: int_title_group_registry
    description: >
      The valid title groups, which is NOT the same list as the anchor
      seed. A group is real if it has anchors or patterns - librarian has
      zero anchors and is defined entirely by title_group_patterns.csv.
      Exists so the relationships test on role_title_overrides.title_group
      has something true to point at; pointed at the anchor seed it would
      reject a perfectly valid ACCEPT naming a pattern-defined group.
    columns:
      - name: title_group
        tests: [not_null, unique]

  - name: dim_department_discipline
    description: >
      ⭐ DICTIONARY 2. One row per distinct department, mapped to a
      discipline.
    columns:
      - name: department_key
        tests: [unique, not_null]
      - name: discipline_score
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

  - name: int_department_distinct
    description: Distinct department names and frequency.
    columns:
      - name: department_key
        tests: [unique, not_null]
