version: 2

models:
  - name: dim_researcher_role_flags
    description: One row per person, role flags in wide format.
    columns:
      - name: snid
        tests: [unique, not_null]

  - name: fct_role_audience
    description: >
      Audience output joined with consent flags. The evidence_* columns
      record WHY each row is in the list.
    columns:
      - name: snid
        tests: [not_null]

  - name: fct_role_audience_summary
    description: >
      One row per role AND confidence label. Answers "how many can we
      reach", not "how many did we find" - consent is the binding constraint (24% marketing, 19%
      advertising on the measured population). Not grouped by country:
      that is a drill-down on fct_role_audience, not a headline.
    # the grain is one row per role AND label, not per role - this model
    # groups by both, so a plain unique test on role_key fails by design
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [role_key, role_label]
    columns:
      - name: role_key
        tests: [not_null]
      - name: role_label
        tests: [not_null]

  - name: rpt_title_review_queue
    description: >
      Human review queue ordered by frequency. The highest-leverage step
      in the project, and currently the only verification mechanism
      because the LLM judge is disabled.

  - name: fct_braze_contact_roles
    description: >
      ⭐ BRAZE DATA CONTRACT. One row = one contact.
      The four arrays are POSITIONALLY aligned; all are derived from a
      single ordered source. Alignment is verified on every build by
      tests/assert_contract_arrays_aligned.sql.
    columns:
      - name: snid
        tests: [unique, not_null]
      - name: role_inferred
        description: "e.g. ['Head of Faculty', 'Healthcare Professional']"
        tests: [not_null]
      - name: role_detailed_inferred
        description: "e.g. ['Head of Faculty - University', 'Healthcare Professional - Practitioner']"
      - name: role_inferred_data_source
        description: "e.g. ['Orcid', 'Orcid + Web scraping'] - not needed in marketing tools"
      - name: consent_basis
        tests:
          - accepted_values: {values: ['marketing_opt_in', 'legitimate_interest']}
