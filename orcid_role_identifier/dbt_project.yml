name: 'orcid_role_identifier'
version: '1.0.0'
config-version: 2

profile: 'orcid_role_identifier'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
target-path: "target"
# "dbt clean" wipes everything listed here. dbt's default includes
# dbt_packages, which means every clean forces a dbt deps and a fresh
# download of dbt_utils before anything can run again. target/ is the only
# thing that ever needs wiping - it is pure build output and dbt run
# recompiles it anyway - so dbt_packages stays out of this list and the
# installed package survives.
clean-targets: ["target"]

models:
  orcid_role_identifier:
    +persist_docs: {relation: true, columns: true}
    raw: {+materialized: view, +schema: raw}
    staging: {+materialized: view, +schema: staging}
    dictionary: {+materialized: table, +schema: dictionary}
    scoring: {+materialized: table, +schema: scoring}
    presentation: {+materialized: table, +schema: presentation}

seeds:
  orcid_role_identifier:
    +schema: seeds

vars:
  target_project: 'dat-analytics-eng-ec869189'
  public_visibility_only: true

  tier_a_min_frequency: 50
  tier_b_min_frequency: 3

  embedding_model: 'datasn-rm-live.institution_disambiguation.embedding_model'

  sim_floor: 0.65
  # The margin between first and second choice. NOT a gate - it vetoes
  # nothing. A value whose top two groups sit closer than this, and which
  # carries enough records to matter, goes to the human review queue.
  #
  # 0.18 made the queue useless. Measured margins run from 0.038 to 0.091
  # on average across every group, so a 0.18 threshold flagged essentially
  # the whole dictionary and the review queue came back as "everything,
  # ordered by frequency" - indistinguishable from query 5 beside it.
  #
  # 0.02 isolates the tail that is genuinely a coin flip, and the tail is
  # real: fellow 0.001, research assistant professor 0.003, medical student
  # 0.004, assistant 0.005, senior research associate 0.006. Those five
  # alone carry 217,000 records between them.
  sim_review_margin: 0.02

  roles:
    # ------------------------------------------------------------------
    # HCP is four roles, mirroring the Phase-1 bucket split.
    #
    #   hcp_broad          the wide net - nobody clinical is lost here
    #   hcp_practitioner   treats patients
    #   hcp_researcher     researches in a clinical field
    #   hcp_administrator  runs a clinical unit
    #
    # The three sub-roles declare "match: all", so BOTH a matching title
    # and a clinical department are required. That is what makes them
    # precise, and it is not optional: under the default "any" the title
    # arm of hcp_researcher would admit every researcher on earth, which
    # is exactly how the Phase-1 regex ended up labelling 191 physics
    # postdocs as healthcare professionals.
    #
    # All three roll up into hcp_broad, carrying the Phase-1 bucket name,
    # so hcp_broad is a superset in both membership and confidence - the
    # roll-up hands it the child's score when the child scores higher.
    # ------------------------------------------------------------------
    hcp_broad:
      display_name: 'Healthcare Professional (broad)'
      detail_dimension: bucket
      enabled: true
      label: 'Healthcare Professional - any clinical signal'
      axis: profession
      # MERVE'S DECISION, 2026-11-04: THE JOB TITLE IS MANDATORY.
      #   "klinik unvan yoksa asla alma iceri - job title bu projede en
      #    onemli kolon"
      # Was title_or_field, the only role that used it. Measured first, in
      # analyses/34 query 5: of hcp_broad's 39,008 own CONFIRMED rows,
      # 6,115 (15.7%) carried NO clinical title at all. They were in the
      # audience because their department read as clinical - a hospital
      # administrator in a cardiology department, a lab manager in
      # oncology. Those 6,115 leave. 1,445 of them were marketable.
      # The 1,624 rows with a clinical title but no department STAY: the
      # title is the evidence and 11.6% of records have no department.
      match: title_required
      title_groups: ['practitioner', 'trainee_clinical']
      disciplines: ['health_clinical']
      # Unchanged from the role formerly called 'hcp', so the audience
      # stays comparable with the 2026-10-08 baseline.
      weights: {role: 0.35, org: 0.25, dept: 0.40}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    hcp_practitioner:
      display_name: 'HCP - Practitioner'
      detail_dimension: org_type
      enabled: true
      label: 'Healthcare Practitioner'
      axis: profession
      match: title_and_field
      parent: 'hcp_broad'
      parent_bucket: 'PRACTITIONER'
      title_groups: ['practitioner', 'trainee_clinical']
      disciplines: ['health_clinical']
      # With match:all both axes are guaranteed present, so the floor is
      # already 0.45*0.70 + 0.40*0.70 + org = ~0.63. A 0.70 threshold
      # therefore means "a good match on both axes", not "a match".
      #   Resident / Internal Medicine / hospital   = 1.00  CONFIRMED
      #   Resident / Internal Medicine / unresolved = 0.89  CONFIRMED
      #   weak title + weak dept + unresolved       = 0.63  PROBABLE
      weights: {role: 0.45, org: 0.15, dept: 0.40}
      thresholds: {confirmed: 0.70, probable: 0.50}
      current_only: false

    hcp_researcher:
      display_name: 'HCP - Researcher'
      detail_dimension: org_type
      enabled: true
      label: 'Clinical / Biomedical Researcher'
      axis: profession
      match: title_and_field
      parent: 'hcp_broad'
      parent_bucket: 'RESEARCHER'
      title_groups: ['researcher']
      # MERVE, RELAYING MARKETING, 2026-11-11: BIOMEDICAL RESEARCHERS ARE IN.
      #   "biomedical researcher saglik personeli mi sorusunda 15K kisinin
      #    hangi audience a girecegini dokumanda belirt. hcp broad ve hcp
      #    researchers olmasi lazim."
      # One word, and the label goes back to the name it carried for one
      # commit in October. They reach hcp_broad for free: this role declares
      # parent: hcp_broad and fct_researcher_roles unions every child row up
      # to the parent, relabelling at the parent's own 0.60 threshold.
      disciplines: ['health_clinical', 'life_biomedical']
      # The title makes it research and the department makes it clinical,
      # so the two carry equal weight.
      #
      # WHERE THE SECOND DISCIPLINE CAME FROM. analyses/17 query 8a asked
      # where the 118,497 people Phase-1 calls HCP and we did not land.
      # 15,588 of them are researchers whose department reads
      # life_biomedical, and this line is the whole of that recovery.
      #
      # AND THE ONE CONSEQUENCE, WHICH IS NOT A SCORING QUESTION. hcp_broad
      # is labelled 'Healthcare Professional (broad)' and now contains
      # ~15,588 people who have never seen a patient. Nothing is broken -
      # the roll-up is doing what it was asked - but the NAME no longer
      # describes the audience, and somebody picking it for a campaign about
      # clinical guidelines will reach them. Marketing has the question as
      # question 1 of ORCID-Questions-for-Marketing.docx: rename hcp_broad,
      # or stop rolling this child up into it. We recommend renaming,
      # because hcp_practitioner already IS the clinical audience at 46,450
      # reachable people.
      #
      # Measured before it landed in analyses/50 query 1.
      weights: {role: 0.40, org: 0.20, dept: 0.40}
      thresholds: {confirmed: 0.70, probable: 0.50}
      current_only: false

    hcp_administrator:
      display_name: 'HCP - Administrator'
      detail_dimension: org_type
      enabled: true
      label: 'Clinical Leadership / Administration'
      axis: profession
      match: title_and_field
      parent: 'hcp_broad'
      parent_bucket: 'ADMINISTRATOR'
      title_groups: ['leadership']
      disciplines: ['health_clinical']
      # Leadership titles are the most ambiguous set we have, so the
      # organisation carries more here than in the other two.
      weights: {role: 0.35, org: 0.25, dept: 0.40}
      thresholds: {confirmed: 0.70, probable: 0.50}
      current_only: false

    pharmacist:
      display_name: 'Pharmacist'
      detail_dimension: setting
      enabled: true
      label: 'Pharmacist'
      axis: profession
      match: title_required
      parent: 'hcp_broad'
      parent_bucket: 'PRACTITIONER'
      title_groups: ['pharmacist']
      disciplines: ['pharmacy']
      # THE TITLE IS THE ONLY WAY IN. Nobody becomes a pharmacist by
      # working in a pharmacy department, and this role was letting them:
      # under the old 'any' mode a record entered on the title OR the
      # department, and query 9b measured avg_role_score at 0.135 against
      # 0.88-0.95 for every other role - roughly 86% of the population
      # had no pharmacist title at all. They were pharmacy academics and
      # students. That is where 2,719 CONFIRMED against 27,789 PROBABLE
      # came from.
      #
      # The department is now optional and only adds score, so the
      # weights shift towards the title that is doing the work:
      #
      #   pharmacist / pharmacy / hospital    0.55+0.15+0.30 = 1.00  CONF
      #   pharmacist / pharmacy / unresolved  0.55+0.04+0.30 = 0.89  CONF
      #   pharmacist / no dept  / hospital    0.55+0.15      = 0.70  CONF
      #   pharmacist / no dept  / unresolved  0.55+0.04      = 0.59  PROB
      #
      # A clear pharmacist title at a recognised health organisation now
      # confirms without needing the department, which it could not do
      # before - the old 0.40 title weight capped a title-only record at
      # exactly 0.60.
      weights: {role: 0.55, org: 0.15, dept: 0.30}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    librarian:
      enabled: true
      label: 'Librarian / Information Professional'
      axis: profession
      match: title_required
      title_groups: ['librarian']
      disciplines: []
      # NO ANCHORS. This group is defined by seeds/title_group_patterns.csv
      # instead - a title containing librar, bibliotec, bibliotek, библиотек,
      # kütüphane or 図書館 IS a librarian, with no similarity score in the
      # way.
      #
      # It was tried with anchors twice and failed twice, at 69% and 71% of
      # records below 0.75 similarity against practitioner's 40%. The reason
      # is structural, not a tuning problem: librarian is a ONE-WORD
      # profession, and asking a group for five anchors forces four of them
      # to be compounds built from generic occupational nouns, each of which
      # then attracts its generic half. 'library manager' pulled 'manager',
      # 17,340 records. 'chief librarian' pulled chief technology officer.
      # We were asking the embedding to guess something already certain.
      #
      # Two things follow from having no anchors, both good. The group can
      # never be returned by VECTOR_SEARCH, so it cannot take a value from
      # any of the other 21 - the cross-group damage is gone by
      # construction. And every assignment is exact, so group_score is 1.0
      # and these people are all CONFIRMED.
      #
      # The cost is deliberate narrowness. Archivists are not included:
      # 'archivist' as an anchor pulled archaeologist, glaciologist and
      # clerk, and 'arquivista' is a separate judgement from the one
      # marketing asked for. Nor is anybody whose title says only
      # 'information specialist'. If marketing wants either, they are a
      # pattern row or an ACCEPT override, not a guess.
      #
      # WEIGHTS 1 / 0 / 0, WHICH IS A STATEMENT RATHER THAN A SETTING.
      #
      # They were 0.75 / 0.25 / 0.00 and the org axis could not change a
      # single outcome: a PATTERN decision pins role_score to exactly 1.0,
      # so 0.75 alone already cleared the 0.60 threshold and every person
      # confirmed regardless of their organisation. The 0.25 looked like it
      # was doing work and was doing none. Now the configuration says what
      # is actually true - the title is the whole decision.
      #
      # Two consequences, both intended and both worth knowing before
      # reading this role's numbers:
      #   - role_final_score is exactly 1.000 for everyone here. That is
      #     not a suspiciously good score, it is the absence of a score.
      #     Nothing was estimated, so there is nothing to be uncertain
      #     about.
      #   - the probable threshold can never fire, so this role has no
      #     PROBABLE tier at all. The thresholds stay because the registry
      #     expects them, not because they decide anything.
      #
      # If this role ever goes back to anchors, both lines have to be
      # reconsidered together - 1/0/0 is only honest while every
      # assignment is exact.
      #
      # dept weight is 0 and the discipline list is empty. library_
      # information was dropped and 'library' and 'university library'
      # went back to non_academic.
      weights: {role: 1.00, org: 0.00, dept: 0.00}
      thresholds: {confirmed: 0.60, probable: 0.35}
      current_only: true

    researcher:
      display_name: 'Researcher'
      detail_dimension: org_type
      enabled: true
      label: 'Researcher (all fields)'
      axis: position
      match: title_required   # no fields listed, so the title is the only axis
      title_groups: ['researcher']
      disciplines: []
      weights: {role: 0.75, org: 0.25, dept: 0.00}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    faculty_head:
      display_name: 'Head of Faculty'
      detail_dimension: org_type
      enabled: true
      label: 'Head of Faculty / Department'
      axis: position
      match: title_required   # no fields listed, so the title is the only axis
      title_groups: ['leadership']
      disciplines: []
      # PRECISION ONLY. A second source for faculty leadership is coming
      # and will extend coverage directly, so this role is not trying to
      # be complete - it is trying to be right.
      #
      # ONE lever, not three. analyses/17 query 2a measured the role and
      # killed the other two:
      #
      #   org_type     records   share   avg org   avg role
      #   UNKNOWN       23,996   51.3%     0.117      0.876
      #   education     14,445   30.9%     1.000      0.880
      #   healthcare     2,482    5.3%     0.500      0.897
      #   facility       1,501    3.2%     0.600      0.887
      #   funder         1,811    3.9%     0.413      0.880
      #   government       766    1.6%     0.300      0.860
      #   company          762    1.6%     0.000      0.849
      #
      # Half the role has an organisation we cannot resolve. Zeroing that
      # score is the whole fix - at 0.60 / 0.40 with a 0.65 threshold:
      #
      #   education    0.60*0.880 + 0.40*1.000 = 0.928  CONFIRMED
      #   facility     0.60*0.887 + 0.40*0.600 = 0.772  CONFIRMED
      #   healthcare   0.60*0.897 + 0.40*0.500 = 0.738  CONFIRMED
      #   nonprofit    0.60*0.877 + 0.40*0.400 = 0.686  CONFIRMED
      #   government   0.60*0.860 + 0.40*0.300 = 0.636  PROBABLE
      #   company      0.60*0.849 + 0.00      = 0.509  PROBABLE
      #   UNKNOWN      0.60*0.876 + 0.00      = 0.526  PROBABLE
      #
      # Every confirmed row now has a verified academic or clinical
      # organisation behind it, and nothing borderline survives.
      #
      # The weights stay at 0.60 / 0.40 and the threshold at 0.65. Moving
      # them to 0.50 / 0.50 and 0.75, which is what this comment said
      # before query 2a ran, would have thrown away two legitimate groups:
      #
      #   healthcare   0.50*0.897 + 0.50*0.500 = 0.699   misses 0.75
      #   facility     0.50*0.887 + 0.50*0.600 = 0.744   misses 0.75
      #
      # Teaching hospitals and research institutes, lost for nothing. And
      # healthcare would have missed a 0.70 threshold by 0.001 - the same
      # razor-edge failure the similarity margin was removed for.
      #
      # MEASURED COST (analyses/17 query 2b, corrected). My earlier
      # estimate of ~8,100 lost confirmations came from the broken version
      # of that query, which could only see UNKNOWN rows. The real cost is
      # far smaller and it falls exactly where it should, because a
      # confirmed UNKNOWN row needed role_score >= 0.95 and few had it:
      #
      #   academic titles        corporate titles       ambiguous
      #   personal chair   -0%   executive director -19%  section chief -49%
      #   chair professor  -6%   managing director  -20%  principal     -60%
      #   vice dean        -8%   vice president     -23%
      #   deputy dean      -8%   ceo                -26%
      #   department chair -9%   president          -28%
      #   rector          -10%   chairman           -29%
      #
      # Nothing falls below PROBABLE anywhere - dropped_entirely is 0 for
      # every title - so this removes confirmations, not people.
      #
      # Residual, accepted: roughly 530 corporate titles still confirm,
      # because they sit at organisations ROR resolves as 'education'.
      # Some of those are real - a university's Executive Director of
      # Research is academic leadership - so this is a definition question
      # for marketing, not a scoring bug. The incoming faculty-leadership
      # source is where the genuinely lost academics come back from.
      weights: {role: 0.60, org: 0.40, dept: 0.00}
      thresholds: {confirmed: 0.65, probable: 0.40}
      current_only: true

    lecturer:
      display_name: 'Lecturer'
      detail_dimension: org_type
      enabled: true
      label: 'Lecturer / Teaching Academic'
      axis: position
      match: title_required   # no fields listed, so the title is the only axis
      title_groups: ['teaching_academic']
      disciplines: []
      weights: {role: 0.75, org: 0.25, dept: 0.00}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false
    students:
      # AN OPEN EDUCATION RECORD WAS PROPOSED AS THE GATE HERE, AND MEASURED
      # DOWN. Merve, 2026-11-12: "educations i daha bitmemis yani last date
      # educationda girilmemis kisiler alinsin sadece." educations[] does
      # carry full_start_date and full_end_date as real DATE columns, so the
      # rule was answerable as stated - but of the 198,268 people with an open
      # education record, 99,665 hold a record with NO DATES AT ALL and
      # another 29,846 started over ten years ago. 83% of education records
      # are closed, which proves people fill the field in when they finish, so
      # a blank end date here mostly means "not filled in" rather than
      # "ongoing". The strict reading would have cut this audience from
      # 123,056 to 15,254; the loose one would have traded 107,802 certain
      # people for 183,014 mostly undated ones. Merve, same day: "bugunku
      # kural kalsin. Education'i kapi olarak degil, elimizdeki kisileri
      # dogrulamak icin kullaniriz."
      #
      # So THIS config is the rule, and education is a corroboration measure
      # that lives in analyses/52 query 10 - with Lecturer and Researcher as
      # the baseline, because a professor who recorded their own PhD has an
      # open education record too. Full figures in docs/open-questions.md
      # 2.16; the constraint it confirms was written in 2.7 before anything
      # was measured.
      display_name: 'Student'
      detail_dimension: org_type
      enabled: true
      label: 'Student / Doctoral Candidate'
      axis: position
      match: title_required   # no fields listed, so the title is the only axis
      title_groups: ['student']
      disciplines: []
      # THE GROUP ALREADY EXISTS AND HAS FED NOTHING UNTIL NOW. `student` is
      # one of the nine title groups and has 11 anchors, so the model has been
      # assigning it all along - it simply had no audience on the other end.
      # This block is the other end. Three things fill the group:
      #
      #   VECTOR          the 11 anchors - phd student, doctoral candidate,
      #                   graduate student, doktorand, phd scholar...
      #   PATTERN         title_group_patterns row 28, which moves a title out
      #                   of researcher when it names a student and no research
      #                   word - Merve's 1.17 decision of 10 November
      #   SECOND GROUP    title_group_second, researcher -> student, which is
      #                   21,668 records: doctoral researcher, phd researcher,
      #                   dottorandi, graduate research assistant. These people
      #                   stay in Researcher AND arrive here, which is exactly
      #                   what marketing question 4.1b asked for
      #
      # current_only: true, AND THIS IS THE SETTING THAT DEFINES THE AUDIENCE.
      # Seven of the nine roles count a post somebody has left, because a
      # researcher in 2010 is still a researcher. A student in 2010 is not a
      # student - they are most likely a professor by now, and with
      # current_only false this audience would fill up with the very people
      # Lecturer and Researcher already contain. It is the one setting here
      # that is an argument about what the word means rather than a number to
      # be tuned, which is why it is not copied from anywhere.
      #
      # WEIGHTS AND THRESHOLDS ARE COPIED FROM Lecturer AND Researcher, NOT
      # DERIVED. Those two have the identical shape - title_required, no
      # disciplines, org at 0.25 - and nothing about this audience has been
      # measured yet, so inventing a bespoke curve for it would be a number
      # argued from the shape of the problem. They are a starting point to be
      # measured, and the first reading of the review queue is what should
      # change them.
      #
      # THE BARE `student` ANCHOR WAS A WORRY AND THE MEASUREMENT SAYS IT IS
      # NOT ONE. analyses/51 query 1c, 2026-11-12. The anchor list carries
      # `student,student,en,` - one word, a generic occupational noun - which
      # is the exact shape the librarian block blames for its own failure:
      # 'library manager' matched on 'manager' and pulled 17,340 records. The
      # same shape here predicted staff who work WITH students being read as
      # students.
      #
      # Measured: 80 titles, 130 records, in an audience of 196,161. That is
      # 0.07%, and it is not worth a veto row. Several of those 80 are not
      # even errors - `counseling psychology doctoral student` and `genetic
      # counseling student` are students OF counselling that the measuring
      # regex caught on its own `counsel` stem, and `department manager / phd
      # student` is a doctoral student who also manages a department.
      #
      # WHY THE LIBRARIAN ANALOGY DID NOT HOLD, since the next one-word anchor
      # will raise the same question: `library` names a PLACE, so every job in
      # the building contains the word, while `student` names a STATUS, and
      # titles containing it overwhelmingly describe the person's own. The
      # lesson is about what the word denotes, not about its length.
      #
      # ⭐ AN EDUCATION EMPLOYER IS REQUIRED - MERVE, 2026-11-12.
      # "organizasyon bilgisi cozulmeyenler ogrenci olarak atanmasin. egitim
      #  kurumunda olmalari sart"
      #
      # THE WEIGHTS CHANGED BECAUSE THE RULE WOULD OTHERWISE NOT HAVE BOUND.
      # They were 0.75 / 0.25 / 0.00 with a 0.60 threshold, and under those
      # numbers the organisation axis could not refuse anybody: a PATTERN or
      # second-group assignment pins role_score to 1.0, so 0.75 x 1.0 = 0.75
      # cleared 0.60 on the title alone and the employer was decoration. That
      # is the same emptiness the librarian block records about its own 0.25.
      #
      # 0.60 / 0.40 with a 0.65 threshold is faculty_head's arithmetic, and it
      # is copied deliberately because faculty_head already enforces exactly
      # this rule:
      #
      #     title alone, best case    0.60 x 1.00            = 0.60  < 0.65
      #     title + Education         0.60 x 1.00 + 0.40     = 1.00  >= 0.65
      #     weakest vector title      0.60 x 0.70 + 0.40     = 0.82  >= 0.65
      #
      # So nobody confirms without an Education employer, and with one
      # essentially everybody does. org_type_scores gives Education 1.00 and
      # every other ROR type 0.00, UNKNOWN included - an unresolved
      # organisation is not evidence of anything and is refused by name.
      #
      # AND IT SETTLES THE TRAINEE QUESTION WITHOUT A TITLE RULE. Merve's
      # other decision the same day was that a student on an internship is a
      # student while a graduate trainee at a company is an employee. A
      # company trainee scores 0.00 on the organisation and cannot confirm, so
      # the org rule removes them on its own. A `graduate trainee` employed BY
      # a university is the case it does not catch; analyses/51 query 1c sizes
      # the family and says whether a title veto is needed as well.
      #
      # WHAT THIS COSTS, STATED RATHER THAN DISCOVERED LATER. A medical
      # student whose employer is a hospital and a doctoral student at a
      # research institute are both real students at a non-Education ROR type,
      # and both are now refused. Query 1d measures how many. If the number is
      # large enough to matter, Healthcare and Facility get a score and this
      # comment gets the reason.
      weights: {role: 0.60, org: 0.40, dept: 0.00}
      thresholds: {confirmed: 0.65, probable: 0.30}
      current_only: true

  contract:
    # any_basis: a person qualifies on ANY of the three flags -
    # mkt_pref_opt_in, advertising_opt_in, or
    # is_legitimate_interest_author_opted_in. Three separate legal bases.
    consent_basis: 'any_basis'
    include_labels: ['CONFIRMED']
    array_order: 'alphabetical'
    detail_separator: ' - '
    detail_source_separator: ' + '

  abbreviations:
    - {from: '\\bprof\\b', to: 'professor'}
    - {from: '\\bassoc\\b', to: 'associate'}
    - {from: '\\basst\\b', to: 'assistant'}
    - {from: '\\bsr\\b', to: 'senior'}
    - {from: '\\bjr\\b', to: 'junior'}
    - {from: '\\bdept\\b', to: 'department'}
    - {from: '\\bdiv\\b', to: 'division'}
    - {from: '\\bdir\\b', to: 'director'}
    - {from: '\\bmgr\\b', to: 'manager'}
    - {from: '\\bres\\b', to: 'research'}
    - {from: '\\bsci\\b', to: 'scientist'}
