name: 'orcid_role_identifier'
version: '1.0.0'
config-version: 2

profile: 'orcid_role_identifier'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
target-path: "target"
# "dbt clean" wipes everything listed here. dbt's default includes
# dbt_packages, which means every clean forces a dbt deps and a fresh
# download of dbt_utils before anything can run again. target/ is the only
# thing that ever needs wiping - it is pure build output and dbt run
# recompiles it anyway - so dbt_packages stays out of this list and the
# installed package survives.
clean-targets: ["target"]

models:
  orcid_role_identifier:
    +persist_docs: {relation: true, columns: true}
    raw: {+materialized: view, +schema: raw}
    staging: {+materialized: view, +schema: staging}
    dictionary: {+materialized: table, +schema: dictionary}
    scoring: {+materialized: table, +schema: scoring}
    presentation: {+materialized: table, +schema: presentation}

seeds:
  orcid_role_identifier:
    +schema: seeds

vars:
  target_project: 'dat-analytics-eng-ec869189'
  public_visibility_only: true

  tier_a_min_frequency: 50
  tier_b_min_frequency: 3

  embedding_model: 'datasn-rm-live.institution_disambiguation.embedding_model'

  sim_floor: 0.65
  # The margin between first and second choice. NOT a gate - it vetoes
  # nothing. A value whose top two groups sit closer than this, and which
  # carries enough records to matter, goes to the human review queue.
  #
  # 0.18 made the queue useless. Measured margins run from 0.038 to 0.091
  # on average across every group, so a 0.18 threshold flagged essentially
  # the whole dictionary and the review queue came back as "everything,
  # ordered by frequency" - indistinguishable from query 5 beside it.
  #
  # 0.02 isolates the tail that is genuinely a coin flip, and the tail is
  # real: fellow 0.001, research assistant professor 0.003, medical student
  # 0.004, assistant 0.005, senior research associate 0.006. Those five
  # alone carry 217,000 records between them.
  sim_review_margin: 0.02

  roles:
    # ------------------------------------------------------------------
    # HCP is four roles, mirroring the Phase-1 bucket split.
    #
    #   hcp_broad          the wide net - nobody clinical is lost here
    #   hcp_practitioner   treats patients
    #   hcp_researcher     researches in a clinical field
    #   hcp_administrator  runs a clinical unit
    #
    # The three sub-roles declare "match: all", so BOTH a matching title
    # and a clinical department are required. That is what makes them
    # precise, and it is not optional: under the default "any" the title
    # arm of hcp_researcher would admit every researcher on earth, which
    # is exactly how the Phase-1 regex ended up labelling 191 physics
    # postdocs as healthcare professionals.
    #
    # All three roll up into hcp_broad, carrying the Phase-1 bucket name,
    # so hcp_broad is a superset in both membership and confidence - the
    # roll-up hands it the child's score when the child scores higher.
    # ------------------------------------------------------------------
    hcp_broad:
      display_name: 'Healthcare Professional (broad)'
      detail_dimension: bucket
      enabled: true
      label: 'Healthcare Professional - any clinical signal'
      axis: profession
      match: title_or_field
      title_groups: ['practitioner', 'trainee_clinical']
      disciplines: ['health_clinical']
      # Unchanged from the role formerly called 'hcp', so the audience
      # stays comparable with the 2026-10-08 baseline.
      weights: {role: 0.35, org: 0.25, dept: 0.40}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    hcp_practitioner:
      display_name: 'HCP - Practitioner'
      detail_dimension: org_type
      enabled: true
      label: 'Healthcare Practitioner'
      axis: profession
      match: title_and_field
      parent: 'hcp_broad'
      parent_bucket: 'PRACTITIONER'
      title_groups: ['practitioner', 'trainee_clinical']
      disciplines: ['health_clinical']
      # With match:all both axes are guaranteed present, so the floor is
      # already 0.45*0.70 + 0.40*0.70 + org = ~0.63. A 0.70 threshold
      # therefore means "a good match on both axes", not "a match".
      #   Resident / Internal Medicine / hospital   = 1.00  CONFIRMED
      #   Resident / Internal Medicine / unresolved = 0.89  CONFIRMED
      #   weak title + weak dept + unresolved       = 0.63  PROBABLE
      weights: {role: 0.45, org: 0.15, dept: 0.40}
      thresholds: {confirmed: 0.70, probable: 0.50}
      current_only: false

    hcp_researcher:
      display_name: 'HCP - Researcher'
      detail_dimension: org_type
      enabled: true
      label: 'Clinical Researcher'
      axis: profession
      match: title_and_field
      parent: 'hcp_broad'
      parent_bucket: 'RESEARCHER'
      title_groups: ['researcher_early', 'researcher_established']
      disciplines: ['health_clinical']
      # The title makes it research and the department makes it clinical,
      # so the two carry equal weight.
      #
      # DELIBERATELY NOT life_biomedical. This was labelled "Clinical /
      # Biomedical Researcher" for one commit, which the config never
      # matched - renamed rather than widened, and here is the number
      # behind that choice.
      #
      # analyses/17 query 8a asked where the 118,497 people Phase-1 calls
      # HCP and we do not actually land. 15,588 of them are researchers
      # whose department reads as life_biomedical:
      #
      #   researcher_early       + life_biomedical   11,979 people
      #   researcher_established + life_biomedical    3,609 people
      #
      # Adding 'life_biomedical' here would recover all of them in one
      # line. It is not a scoring question, it is what HCP means. A
      # biomedical researcher is already found by the 'researcher' role,
      # and rolling them into hcp_broad would make 'Healthcare
      # Professional' include people who have never seen a patient -
      # which is not what marketing will assume when they pick the
      # audience. So HCP stays clinical.
      #
      # If marketing wants them, add the one word and rename the label
      # back. The decision belongs to them, not to the model.
      weights: {role: 0.40, org: 0.20, dept: 0.40}
      thresholds: {confirmed: 0.70, probable: 0.50}
      current_only: false

    hcp_administrator:
      display_name: 'HCP - Administrator'
      detail_dimension: org_type
      enabled: true
      label: 'Clinical Leadership / Administration'
      axis: profession
      match: title_and_field
      parent: 'hcp_broad'
      parent_bucket: 'ADMINISTRATOR'
      title_groups: ['leadership']
      disciplines: ['health_clinical']
      # Leadership titles are the most ambiguous set we have, so the
      # organisation carries more here than in the other two.
      weights: {role: 0.35, org: 0.25, dept: 0.40}
      thresholds: {confirmed: 0.70, probable: 0.50}
      current_only: false

    pharmacist:
      display_name: 'Pharmacist'
      detail_dimension: setting
      enabled: true
      label: 'Pharmacist'
      axis: profession
      match: title_required
      parent: 'hcp_broad'
      parent_bucket: 'PRACTITIONER'
      title_groups: ['pharmacist']
      disciplines: ['pharmacy']
      # THE TITLE IS THE ONLY WAY IN. Nobody becomes a pharmacist by
      # working in a pharmacy department, and this role was letting them:
      # under the old 'any' mode a record entered on the title OR the
      # department, and query 9b measured avg_role_score at 0.135 against
      # 0.88-0.95 for every other role - roughly 86% of the population
      # had no pharmacist title at all. They were pharmacy academics and
      # students. That is where 2,719 CONFIRMED against 27,789 PROBABLE
      # came from.
      #
      # The department is now optional and only adds score, so the
      # weights shift towards the title that is doing the work:
      #
      #   pharmacist / pharmacy / hospital    0.55+0.15+0.30 = 1.00  CONF
      #   pharmacist / pharmacy / unresolved  0.55+0.04+0.30 = 0.89  CONF
      #   pharmacist / no dept  / hospital    0.55+0.15      = 0.70  CONF
      #   pharmacist / no dept  / unresolved  0.55+0.04      = 0.59  PROB
      #
      # A clear pharmacist title at a recognised health organisation now
      # confirms without needing the department, which it could not do
      # before - the old 0.40 title weight capped a title-only record at
      # exactly 0.60.
      weights: {role: 0.55, org: 0.15, dept: 0.30}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    librarian:
      display_name: 'Librarian'
      detail_dimension: org_type
      enabled: false
      label: 'Librarian / Information Professional'
      axis: profession
      match: title_required   # no fields listed, so the title is the only axis
      title_groups: ['librarian']
      disciplines: ['library_information']
      weights: {role: 0.70, org: 0.20, dept: 0.10}
      thresholds: {confirmed: 0.60, probable: 0.35}
      current_only: true

    researcher:
      display_name: 'Researcher'
      detail_dimension: org_type
      enabled: true
      label: 'Researcher (all fields)'
      axis: position
      match: title_required   # no fields listed, so the title is the only axis
      title_groups: ['researcher_early', 'researcher_established']
      disciplines: []
      weights: {role: 0.75, org: 0.25, dept: 0.00}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    faculty_head:
      display_name: 'Head of Faculty'
      detail_dimension: org_type
      enabled: true
      label: 'Head of Faculty / Department'
      axis: position
      match: title_required   # no fields listed, so the title is the only axis
      title_groups: ['leadership']
      disciplines: []
      # PRECISION ONLY. A second source for faculty leadership is coming
      # and will extend coverage directly, so this role is not trying to
      # be complete - it is trying to be right.
      #
      # ONE lever, not three. analyses/17 query 2a measured the role and
      # killed the other two:
      #
      #   org_type     records   share   avg org   avg role
      #   UNKNOWN       23,996   51.3%     0.117      0.876
      #   education     14,445   30.9%     1.000      0.880
      #   healthcare     2,482    5.3%     0.500      0.897
      #   facility       1,501    3.2%     0.600      0.887
      #   funder         1,811    3.9%     0.413      0.880
      #   government       766    1.6%     0.300      0.860
      #   company          762    1.6%     0.000      0.849
      #
      # Half the role has an organisation we cannot resolve. Zeroing that
      # score is the whole fix - at 0.60 / 0.40 with a 0.65 threshold:
      #
      #   education    0.60*0.880 + 0.40*1.000 = 0.928  CONFIRMED
      #   facility     0.60*0.887 + 0.40*0.600 = 0.772  CONFIRMED
      #   healthcare   0.60*0.897 + 0.40*0.500 = 0.738  CONFIRMED
      #   nonprofit    0.60*0.877 + 0.40*0.400 = 0.686  CONFIRMED
      #   government   0.60*0.860 + 0.40*0.300 = 0.636  PROBABLE
      #   company      0.60*0.849 + 0.00      = 0.509  PROBABLE
      #   UNKNOWN      0.60*0.876 + 0.00      = 0.526  PROBABLE
      #
      # Every confirmed row now has a verified academic or clinical
      # organisation behind it, and nothing borderline survives.
      #
      # The weights stay at 0.60 / 0.40 and the threshold at 0.65. Moving
      # them to 0.50 / 0.50 and 0.75, which is what this comment said
      # before query 2a ran, would have thrown away two legitimate groups:
      #
      #   healthcare   0.50*0.897 + 0.50*0.500 = 0.699   misses 0.75
      #   facility     0.50*0.887 + 0.50*0.600 = 0.744   misses 0.75
      #
      # Teaching hospitals and research institutes, lost for nothing. And
      # healthcare would have missed a 0.70 threshold by 0.001 - the same
      # razor-edge failure the similarity margin was removed for.
      #
      # MEASURED COST (analyses/17 query 2b, corrected). My earlier
      # estimate of ~8,100 lost confirmations came from the broken version
      # of that query, which could only see UNKNOWN rows. The real cost is
      # far smaller and it falls exactly where it should, because a
      # confirmed UNKNOWN row needed role_score >= 0.95 and few had it:
      #
      #   academic titles        corporate titles       ambiguous
      #   personal chair   -0%   executive director -19%  section chief -49%
      #   chair professor  -6%   managing director  -20%  principal     -60%
      #   vice dean        -8%   vice president     -23%
      #   deputy dean      -8%   ceo                -26%
      #   department chair -9%   president          -28%
      #   rector          -10%   chairman           -29%
      #
      # Nothing falls below PROBABLE anywhere - dropped_entirely is 0 for
      # every title - so this removes confirmations, not people.
      #
      # Residual, accepted: roughly 530 corporate titles still confirm,
      # because they sit at organisations ROR resolves as 'education'.
      # Some of those are real - a university's Executive Director of
      # Research is academic leadership - so this is a definition question
      # for marketing, not a scoring bug. The incoming faculty-leadership
      # source is where the genuinely lost academics come back from.
      weights: {role: 0.60, org: 0.40, dept: 0.00}
      thresholds: {confirmed: 0.65, probable: 0.40}
      current_only: true

    lecturer:
      display_name: 'Lecturer'
      detail_dimension: org_type
      enabled: true
      label: 'Lecturer / Teaching Academic'
      axis: position
      match: title_required   # no fields listed, so the title is the only axis
      title_groups: ['teaching_academic']
      disciplines: []
      weights: {role: 0.75, org: 0.25, dept: 0.00}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

  contract:
    consent_basis: 'marketing_opt_in'
    include_labels: ['CONFIRMED']
    array_order: 'alphabetical'
    detail_separator: ' - '
    detail_source_separator: ' + '

  abbreviations:
    - {from: '\\bprof\\b', to: 'professor'}
    - {from: '\\bassoc\\b', to: 'associate'}
    - {from: '\\basst\\b', to: 'assistant'}
    - {from: '\\bsr\\b', to: 'senior'}
    - {from: '\\bjr\\b', to: 'junior'}
    - {from: '\\bdept\\b', to: 'department'}
    - {from: '\\bdiv\\b', to: 'division'}
    - {from: '\\bdir\\b', to: 'director'}
    - {from: '\\bmgr\\b', to: 'manager'}
    - {from: '\\bres\\b', to: 'research'}
    - {from: '\\bsci\\b', to: 'scientist'}
    - {from: '\\bphys\\b', to: 'physician'}
    - {from: '\\bpharm\\b', to: 'pharmacy'}
    - {from: '\\bmed\\b', to: 'medical'}
    - {from: '\\bclin\\b', to: 'clinical'}
    - {from: '\\buniv\\b', to: 'university'}
    - {from: '\\bhosp\\b', to: 'hospital'}
    - {from: '\\blib\\b', to: 'library'}
    - {from: '\\bpi\\b', to: 'principal investigator'}
    - {from: '\\bpdra\\b', to: 'postdoctoral research associate'}
    - {from: '\\bpost doc\\b', to: 'postdoc'}
    - {from: '\\bpost-doc\\b', to: 'postdoc'}