name: 'orcid_role_identifier'
version: '1.0.0'
config-version: 2

profile: 'orcid_role_identifier'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  orcid_role_identifier:
    +persist_docs: {relation: true, columns: true}
    raw: {+materialized: view, +schema: raw}
    staging: {+materialized: view, +schema: staging}
    dictionary: {+materialized: table, +schema: dictionary}
    scoring: {+materialized: table, +schema: scoring}
    presentation: {+materialized: table, +schema: presentation}

seeds:
  orcid_role_identifier:
    +schema: seeds

vars:
  target_project: 'dat-analytics-eng-ec869189'
  public_visibility_only: true

  tier_a_min_frequency: 50
  tier_b_min_frequency: 3

  embedding_model: 'datasn-rm-live.institution_disambiguation.embedding_model'

  sim_min_margin: 0.13
  sim_floor: 0.65
  sim_review_margin: 0.18

  roles:
    hcp:
      display_name: 'Healthcare Professional'
      detail_dimension: bucket
      enabled: true
      label: 'Healthcare Professional'
      axis: profession
      title_groups: ['practitioner', 'trainee_clinical']
      disciplines: ['health_clinical']
      weights: {role: 0.35, org: 0.25, dept: 0.40}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    pharmacist:
      display_name: 'Pharmacist'
      detail_dimension: setting
      enabled: true
      label: 'Pharmacist'
      axis: profession
      parent: 'hcp'
      parent_bucket: 'PRACTITIONER'
      title_groups: ['pharmacist']
      disciplines: ['pharmacy']
      weights: {role: 0.40, org: 0.20, dept: 0.40}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    librarian:
      display_name: 'Librarian'
      detail_dimension: org_type
      enabled: false
      label: 'Librarian / Information Professional'
      axis: profession
      title_groups: ['librarian']
      disciplines: ['library_information']
      weights: {role: 0.70, org: 0.20, dept: 0.10}
      thresholds: {confirmed: 0.60, probable: 0.35}
      current_only: true

    researcher:
      display_name: 'Researcher'
      detail_dimension: org_type
      enabled: true
      label: 'Researcher (all fields)'
      axis: position
      title_groups: ['researcher_early', 'researcher_established']
      disciplines: []
      weights: {role: 0.75, org: 0.25, dept: 0.00}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    faculty_head:
      display_name: 'Head of Faculty'
      detail_dimension: org_type
      enabled: true
      label: 'Head of Faculty / Department'
      axis: position
      title_groups: ['leadership']
      disciplines: []
      # Organisation weight raised from 0.30 to 0.45. The first run showed
      # this role collecting company executives - CEO, Founder, Managing
      # Director - because a strong title alone cleared the threshold:
      #     1.00*0.70 + 0.20*0.30 = 0.76  against a 0.65 threshold
      # At 0.55 / 0.45 the title can no longer carry it alone:
      #     company, org 0.00   1.00*0.55 + 0.00 = 0.55  rejected
      #     unknown org 0.20    1.00*0.55 + 0.09 = 0.64  rejected
      #     university  1.00    1.00*0.55 + 0.45 = 1.00  confirmed
      # A hard gate would be blunter; this still lets a genuine dean at an
      # unresolved institution reach PROBABLE.
      weights: {role: 0.55, org: 0.45, dept: 0.00}
      thresholds: {confirmed: 0.65, probable: 0.40}
      current_only: true

    lecturer:
      display_name: 'Lecturer'
      detail_dimension: org_type
      enabled: true
      label: 'Lecturer / Teaching Academic'
      axis: position
      title_groups: ['teaching_academic']
      disciplines: []
      weights: {role: 0.75, org: 0.25, dept: 0.00}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

  contract:
    consent_basis: 'marketing_opt_in'
    include_labels: ['CONFIRMED']
    array_order: 'alphabetical'
    detail_separator: ' - '
    detail_source_separator: ' + '

  abbreviations:
    - {from: '\\bprof\\b', to: 'professor'}
    - {from: '\\bassoc\\b', to: 'associate'}
    - {from: '\\basst\\b', to: 'assistant'}
    - {from: '\\bsr\\b', to: 'senior'}
    - {from: '\\bjr\\b', to: 'junior'}
    - {from: '\\bdept\\b', to: 'department'}
    - {from: '\\bdiv\\b', to: 'division'}
    - {from: '\\bdir\\b', to: 'director'}
    - {from: '\\bmgr\\b', to: 'manager'}
    - {from: '\\bres\\b', to: 'research'}
    - {from: '\\bsci\\b', to: 'scientist'}
    - {from: '\\bphys\\b', to: 'physician'}
    - {from: '\\bpharm\\b', to: 'pharmacy'}
    - {from: '\\bmed\\b', to: 'medical'}
    - {from: '\\bclin\\b', to: 'clinical'}
    - {from: '\\buniv\\b', to: 'university'}
    - {from: '\\bhosp\\b', to: 'hospital'}
    - {from: '\\blib\\b', to: 'library'}
    - {from: '\\bpi\\b', to: 'principal investigator'}
    - {from: '\\bpdra\\b', to: 'postdoctoral research associate'}
    - {from: '\\bpost doc\\b', to: 'postdoc'}
    - {from: '\\bpost-doc\\b', to: 'postdoc'}