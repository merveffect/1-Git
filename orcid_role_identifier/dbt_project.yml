name: 'orcid_role_identifier'
version: '1.0.0'
config-version: 2

profile: 'orcid_role_identifier'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  orcid_role_identifier:
    +persist_docs: {relation: true, columns: true}
    raw: {+materialized: view, +schema: raw}
    staging: {+materialized: view, +schema: staging}
    dictionary: {+materialized: table, +schema: dictionary}
    scoring: {+materialized: table, +schema: scoring}
    presentation: {+materialized: table, +schema: presentation}

seeds:
  orcid_role_identifier:
    +schema: seeds

vars:
  target_project: 'dat-analytics-eng-ec869189'
  public_visibility_only: true

  tier_a_min_frequency: 50
  tier_b_min_frequency: 3

  embedding_model: 'datasn-rm-live.institution_disambiguation.embedding_model'

  sim_floor: 0.65
  # The margin between first and second choice. NOT a gate - it vetoes
  # nothing. A value whose top two groups sit closer than this, and which
  # carries enough records to matter, goes to the human review queue.
  sim_review_margin: 0.18

  roles:
    # ------------------------------------------------------------------
    # HCP is four roles, mirroring the Phase-1 bucket split.
    #
    #   hcp_broad          the wide net - nobody clinical is lost here
    #   hcp_practitioner   treats patients
    #   hcp_researcher     researches in a clinical field
    #   hcp_administrator  runs a clinical unit
    #
    # The three sub-roles declare "match: all", so BOTH a matching title
    # and a clinical department are required. That is what makes them
    # precise, and it is not optional: under the default "any" the title
    # arm of hcp_researcher would admit every researcher on earth, which
    # is exactly how the Phase-1 regex ended up labelling 191 physics
    # postdocs as healthcare professionals.
    #
    # All three roll up into hcp_broad, carrying the Phase-1 bucket name,
    # so hcp_broad is a superset in both membership and confidence - the
    # roll-up hands it the child's score when the child scores higher.
    # ------------------------------------------------------------------
    hcp_broad:
      display_name: 'Healthcare Professional (broad)'
      detail_dimension: bucket
      enabled: true
      label: 'Healthcare Professional - any clinical signal'
      axis: profession
      match: any
      title_groups: ['practitioner', 'trainee_clinical']
      disciplines: ['health_clinical']
      # Unchanged from the role formerly called 'hcp', so the audience
      # stays comparable with the 2026-10-08 baseline.
      weights: {role: 0.35, org: 0.25, dept: 0.40}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    hcp_practitioner:
      display_name: 'HCP - Practitioner'
      detail_dimension: org_type
      enabled: true
      label: 'Healthcare Practitioner'
      axis: profession
      match: all
      parent: 'hcp_broad'
      parent_bucket: 'PRACTITIONER'
      title_groups: ['practitioner', 'trainee_clinical']
      disciplines: ['health_clinical']
      # With match:all both axes are guaranteed present, so the floor is
      # already 0.45*0.70 + 0.40*0.70 + org = ~0.63. A 0.70 threshold
      # therefore means "a good match on both axes", not "a match".
      #   Resident / Internal Medicine / hospital   = 1.00  CONFIRMED
      #   Resident / Internal Medicine / unresolved = 0.89  CONFIRMED
      #   weak title + weak dept + unresolved       = 0.63  PROBABLE
      weights: {role: 0.45, org: 0.15, dept: 0.40}
      thresholds: {confirmed: 0.70, probable: 0.50}
      current_only: false

    hcp_researcher:
      display_name: 'HCP - Researcher'
      detail_dimension: org_type
      enabled: true
      label: 'Clinical / Biomedical Researcher'
      axis: profession
      match: all
      parent: 'hcp_broad'
      parent_bucket: 'RESEARCHER'
      title_groups: ['researcher_early', 'researcher_established']
      disciplines: ['health_clinical']
      # The title makes it research and the department makes it clinical,
      # so the two carry equal weight.
      weights: {role: 0.40, org: 0.20, dept: 0.40}
      thresholds: {confirmed: 0.70, probable: 0.50}
      current_only: false

    hcp_administrator:
      display_name: 'HCP - Administrator'
      detail_dimension: org_type
      enabled: true
      label: 'Clinical Leadership / Administration'
      axis: profession
      match: all
      parent: 'hcp_broad'
      parent_bucket: 'ADMINISTRATOR'
      title_groups: ['leadership']
      disciplines: ['health_clinical']
      # Leadership titles are the most ambiguous set we have, so the
      # organisation carries more here than in the other two.
      weights: {role: 0.35, org: 0.25, dept: 0.40}
      thresholds: {confirmed: 0.70, probable: 0.50}
      current_only: false

    pharmacist:
      display_name: 'Pharmacist'
      detail_dimension: setting
      enabled: true
      label: 'Pharmacist'
      axis: profession
      parent: 'hcp_broad'
      parent_bucket: 'PRACTITIONER'
      title_groups: ['pharmacist']
      disciplines: ['pharmacy']
      weights: {role: 0.40, org: 0.20, dept: 0.40}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    librarian:
      display_name: 'Librarian'
      detail_dimension: org_type
      enabled: false
      label: 'Librarian / Information Professional'
      axis: profession
      title_groups: ['librarian']
      disciplines: ['library_information']
      weights: {role: 0.70, org: 0.20, dept: 0.10}
      thresholds: {confirmed: 0.60, probable: 0.35}
      current_only: true

    researcher:
      display_name: 'Researcher'
      detail_dimension: org_type
      enabled: true
      label: 'Researcher (all fields)'
      axis: position
      title_groups: ['researcher_early', 'researcher_established']
      disciplines: []
      weights: {role: 0.75, org: 0.25, dept: 0.00}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

    faculty_head:
      display_name: 'Head of Faculty'
      detail_dimension: org_type
      enabled: true
      label: 'Head of Faculty / Department'
      axis: position
      title_groups: ['leadership']
      disciplines: []
      # PRECISION ONLY. A second source for faculty leadership is coming,
      # and it will extend coverage directly. So this role is not trying
      # to be complete - it is trying to be right, and anything borderline
      # is left out on purpose.
      #
      # Three levers, each measurable on its own:
      #   1. The unresolved-organisation score is 0.00, not 0.20
      #      (org_type_scores.csv). An organisation we cannot identify
      #      can no longer carry a title over the line.
      #   2. The organisation now carries half the score, because it is
      #      the only thing that separates a dean from a founder.
      #   3. The threshold is 0.75, so both halves have to be strong.
      #
      #   dean / university           0.50 + 0.50 = 1.00  CONFIRMED
      #   dean / teaching hospital    0.50 + 0.25 = 0.75  CONFIRMED
      #   dean / unresolved org       0.50 + 0.00 = 0.50  PROBABLE, not shipped
      #   founder / company           0.40 + 0.00 = 0.40  dropped entirely
      #   founder / unresolved org    0.40 + 0.00 = 0.40  dropped entirely
      #
      # Residual, accepted knowingly: a corporate title at an organisation
      # that ROR resolves as academic still confirms. Measured by
      # analyses/17 query 1.
      weights: {role: 0.50, org: 0.50, dept: 0.00}
      thresholds: {confirmed: 0.75, probable: 0.50}
      current_only: true

    lecturer:
      display_name: 'Lecturer'
      detail_dimension: org_type
      enabled: true
      label: 'Lecturer / Teaching Academic'
      axis: position
      title_groups: ['teaching_academic']
      disciplines: []
      weights: {role: 0.75, org: 0.25, dept: 0.00}
      thresholds: {confirmed: 0.60, probable: 0.30}
      current_only: false

  contract:
    consent_basis: 'marketing_opt_in'
    include_labels: ['CONFIRMED']
    array_order: 'alphabetical'
    detail_separator: ' - '
    detail_source_separator: ' + '

  abbreviations:
    - {from: '\\bprof\\b', to: 'professor'}
    - {from: '\\bassoc\\b', to: 'associate'}
    - {from: '\\basst\\b', to: 'assistant'}
    - {from: '\\bsr\\b', to: 'senior'}
    - {from: '\\bjr\\b', to: 'junior'}
    - {from: '\\bdept\\b', to: 'department'}
    - {from: '\\bdiv\\b', to: 'division'}
    - {from: '\\bdir\\b', to: 'director'}
    - {from: '\\bmgr\\b', to: 'manager'}
    - {from: '\\bres\\b', to: 'research'}
    - {from: '\\bsci\\b', to: 'scientist'}
    - {from: '\\bphys\\b', to: 'physician'}
    - {from: '\\bpharm\\b', to: 'pharmacy'}
    - {from: '\\bmed\\b', to: 'medical'}
    - {from: '\\bclin\\b', to: 'clinical'}
    - {from: '\\buniv\\b', to: 'university'}
    - {from: '\\bhosp\\b', to: 'hospital'}
    - {from: '\\blib\\b', to: 'library'}
    - {from: '\\bpi\\b', to: 'principal investigator'}
    - {from: '\\bpdra\\b', to: 'postdoctoral research associate'}
    - {from: '\\bpost doc\\b', to: 'postdoc'}
    - {from: '\\bpost-doc\\b', to: 'postdoc'}