version: 2

seeds:
  - name: title_group_anchors
    description: >
      Anchors for the TITLE axis: 9 position groups. An anchor is an
      example that defines what a group looks like; the nearest group to a
      real title wins. These are the only hand-written input to the
      dictionary.
    config:
      column_types: {title_group: STRING, anchor_term: STRING, language_code: STRING, note: STRING}
    columns:
      - name: title_group
        tests: [not_null]
      - name: anchor_term
        tests: [not_null]

  - name: discipline_anchors
    description: >
      Anchors for the DISCIPLINE axis: 12 groups, matched against
      department names. Measured: assigning a discipline from the job
      title leaves 73.5% of records unusable; from the department, 1.6%.
    config:
      column_types: {discipline: STRING, anchor_term: STRING, language_code: STRING, note: STRING}
    columns:
      - name: discipline
        tests: [not_null]
      - name: anchor_term
        tests: [not_null]

  - name: org_name_patterns
    description: >
      Organisation fallback for the 21% of records with no resolvable ROR
      identifier. organisation_name is 100% populated, so a small pattern
      list rescues most of them. This is what Phase-1 did and it worked.
    config:
      column_types: {role_key: STRING, name_pattern: STRING, org_score: FLOAT64, note: STRING}
    columns:
      - name: role_key
        tests:
          - accepted_values:
              arguments:
                values: "{{ all_role_keys() }}"

  - name: org_type_scores
    description: >
      (role, ROR organisation type) -> org score. Replaces the Phase-1
      organisation regex gradient. Because the type comes from ROR,
      variants like "St. Mary's Hosp." are no longer missed.
    config:
      column_types: {role_key: STRING, org_type: STRING, org_score: FLOAT64, note: STRING}

  - name: role_detail_map
    description: >
      Rules producing the second part of role_detailed_inferred.
      match_type='title' matches the job title, match_type='org_type'
      matches the ROR organisation type. Lowest priority wins.
    config:
      column_types: {role_key: STRING, match_type: STRING, match_value: STRING, detail_label: STRING, priority: INT64, note: STRING}
    columns:
      - name: role_key
        tests:
          - accepted_values:
              arguments:
                values: "{{ all_role_keys() }}"
      - name: match_type
        tests:
          - accepted_values:
              arguments:
                values: ['title', 'org_type']

  - name: role_title_overrides
    description: >
      HUMAN DECISIONS. Always beat the vector and LLM decisions.
      Filled in after working through rpt_title_review_queue.

      One convention, enforced by assert_overrides_take_effect: if you add
      a decision for a title that is not in the ORCID vocabulary yet, put
      [pre-emptive] in the note. Otherwise the test treats a title it
      cannot find as a typo, because a misspelled override is inert while
      looking alive, and that is the failure the test is there to catch.
    config:
      column_types: {title: STRING, title_group: STRING, decision: STRING, reviewer: STRING, reviewed_at: DATE, note: STRING}
    columns:
      - name: decision
        tests:
          - accepted_values:
              arguments:
                values: ['ACCEPT', 'REJECT']
      # an ACCEPT naming something that is not a real title group used to
      # be silently ignored - the value simply matched no role afterwards
      - name: title_group
        tests:
          - relationships:
              arguments:
                to: ref('title_group_anchors')
                field: title_group

  - name: external_role_library
    description: >
      REFERENCE ONLY - nothing scores from this, and nothing should.
      A role library built by another team, received 2026-10-16 as
      "B2C Research Audience - Job Title & Seniority Framework".
      Converted from the xlsx so it is diffable and joinable; the
      binary is not kept in the repo.

      It is one row per job title here. In the sheet the title column
      held semicolon-separated synonyms - 129 role rows carrying 315
      titles - which cannot be joined on, so it is exploded, and 29
      titles that appeared under more than one role are kept once at
      their first occurrence.

      What it is good for: measuring ourselves. 263 of its 286 titles
      were already in our dictionary, and its titles cover 45.8% of all
      our employment records, so it reads as independent confirmation of
      the vocabulary rather than new material. It contributed 17 of our
      44 overrides, mostly the retired and emeritus rejections, and its
      "Former or inactive" sector is where that came from.

      What it is not: a source of truth. Its categories are one team's
      judgement, it is English-only, and 117 of 286 rows are flagged for
      review by its own authors. Treat a disagreement with it as a
      question, not a defect.

      Two quirks preserved rather than cleaned, so our copy still
      matches theirs: seniority has a stray 'Early-career & Support?'
      with a trailing question mark on 5 rows, which is their
      uncertainty marker and not a seventh category; and
      'Variable / title alone insufficient' covers 72 of 286 titles -
      25% of the library - which is the same conclusion our two-axis
      design reached independently, that a title often cannot carry a
      role on its own.
    config:
      column_types: {job_title: STRING, sector: STRING, subcategory: STRING, role_type: STRING, seniority: STRING, seniority_confidence: STRING, review_required: STRING, ambiguity_caveat: STRING}
    columns:
      - name: job_title
        tests: [not_null, unique]
      - name: seniority_confidence
        tests:
          - accepted_values:
              arguments:
                values: ['High', 'Medium']
      - name: review_required
        tests:
          - accepted_values:
              arguments:
                values: ['Yes', 'No']

  - name: title_group_patterns
    description: >
      A title containing one of these strings IS that group. No embedding,
      no similarity, no threshold - it beats the vector and loses only to a
      human override in role_title_overrides.

      It exists because of librarian, which failed twice with anchors at
      69% and 71% of records below 0.75 similarity. The cause was
      structural: librarian is a one-word profession, and requiring five
      anchors per group forces four of them to be compounds built from
      generic occupational nouns, each of which attracts its generic half.
      'library manager' pulled 'manager', 17,340 records. We were asking
      the embedding to guess something already certain.

      When to add a group here rather than anchors: the profession is
      named by one distinctive word, and you would rather have a narrow
      certain audience than a wide probable one. When NOT to: anything
      whose vocabulary is varied or translated unpredictably - clinical
      titles are the clearest counter-example, where Resident, Registrar,
      Facharzt and Interno share no stem and only the embedding can
      connect them.

      A group listed here needs no anchors, which validate_registry.py
      allows explicitly, and because it has none it can never be returned
      by VECTOR_SEARCH - so it cannot take a value from another group.
      That is the main reason to prefer it for a small audience.

      Patterns are matched with REGEXP_CONTAINS against the NORMALISED
      title, which is casefolded and punctuation-stripped but keeps
      accents, since clean_text uses NFKC rather than NFKD. So
      bibliothécaire needs the accented stem.
    config:
      column_types: {title_group: STRING, name_pattern: STRING, note: STRING}
    columns:
      - name: title_group
        tests: [not_null]
      - name: name_pattern
        tests: [not_null, unique]
