dbt_target: prod

jobs:
  # Two jobs because the two pipelines need different cadences.
  #
  # favorite_snt: daily. favorite_snt_predictions refreshes one batch of users
  # per run, so the cadence of this job is what sets how often a given user's
  # predictions get re-evaluated (~25 days at the current batch size). Weekly
  # meant roughly every 6 months. Keeps the original job name so the existing
  # scheduled job is updated in place rather than left running alongside.
  - name: subject-based-segmentation-snt-prod
    schedule: 0 8 * * *
    timeout_seconds: 7200
    select_criteria: "path:models/raw/favorite_snt path:models/staging/favorite_snt path:models/intermediate/favorite_snt path:models/presentation/favorite_snt"

  # favorite_mpc_subject: weekly (Mondays). cdp_inferred_subjects is rebuilt
  # in full every run, and a daily rebuild pushed ~1.5M profile updates a day
  # into Braze.
  - name: subject-based-segmentation-mpc-prod
    schedule: 0 8 * * 1
    timeout_seconds: 7200
    select_criteria: "path:models/staging/favorite_mpc_subject path:models/presentation/favorite_mpc_subject"




