subject_based_segmentation:
  target: dev
  outputs:
    dev:  # gcp environment
      type: bigquery
      method: oauth # can use a SA as authentication too
      project: dat-analytics-eng-ec869189
      dataset: dev_subject_based_segmentation # You can also use "schema" here
      threads: 8
      job_execution_timeout_seconds: 6000
      #timeout_seconds: 6000
      location: EU # Optional, one of US or EU
      priority: interactive
      retries: 1
    prod:  # gcp environment
      type: bigquery
      method: oauth # can use a SA as authentication too
      project: dat-analytics-eng-ec869189
      dataset: prod_subject_based_segmentation # You can also use "schema" here
      threads: 8
      job_execution_timeout_seconds: 6000
      #timeout_seconds: 6000
      location: EU # Optional, one of US or EU
      priority: interactive
      retries: 1
    poc:   # THIS IS THE NEW TARGET FOR poc-gbq MODELS
