name: 'subject_based_segmentation'
version: '1.0.0'

profile: 'subject_based_segmentation'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Users refreshed per favorite_snt_predictions run, stalest first. The
  # scheduled job runs the model once a day, so a full pass over the
  # ~6.16M-user audience takes about 25 days — i.e. roughly monthly.
  # Raising this shortens the cycle proportionally; the model falls back to
  # the same number if this var is removed.
  prediction_batch_size: 250000

models:
  subject_based_segmentation:
    raw:
      +schema: "raw"
      +materialized: table

    staging:
      +schema: "staging"
      +materialized: table

    intermediate:
      +schema: "intermediate"
      +materialized: table

    presentation:
       +schema: "presentation"
       +materialized: table



