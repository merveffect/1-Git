version: 2

models:
  - name: journal_snt_codes
    description: >
      Journal -> SNT id, resolved from snt_discipline_code (validated 100%
      match against snts_full_list as of 2026-09), with SNT_Hierarchy1-4
      used ONLY as a fallback for the ~2.2% of journals with no
      discipline_code — not as an equal additional source. Hierarchy
      columns were found to be dominated by broad umbrella categories
      ("Life Sciences" on 44.6% of journals) which, mixed in equally,
      visibly skewed favorite_snt_predictions toward generic top-level
      SNTs. Independent of favorite_mpc_subject's journal->SNT resolution,
      which is tied to the old SNT reference table.
    columns:
      - name: journal_id
        description: Journal id, as a string (cast from journal_metadata's native INT64).
      - name: snt_id
        description: SNT id associated with this journal (from snt_discipline_code, or SNT_Hierarchy1-4 as a fallback).

  - name: users_and_journal_ids
    description: >
      Long-format (snid, journal_id) pairs covering every journal-relationship
      signal on audience_builder_big (reads, eTOCs, submission guide views,
      submissions, pageviews, interested-in lists) plus Snail's journal
      recommendations (snail_recommendation_journals — ids validated 100%
      against journal_metadata). Scoped to the favorite_snt target audience.
      Feeds the journal-based SNT signal via journal_snt_codes.
    columns:
      - name: snid
        description: SN ID.
      - name: journal_id
        description: A journal this user has some relationship signal with (read, submitted to, recommended, etc.) — the specific signal type isn't preserved, just the fact of the relationship.

  - name: users_with_content_signal
    description: >
      Per-SNID pass-through of keyword reading-behaviour signals. Article
      titles and newsletters were dropped (see model comment). DOI columns
      were also dropped — not planned for use. Scoped to the favorite_snt
      target audience (advertising_opt_in OR mkt_pref_opt_in).
    columns:
      - name: snid
        description: SN ID.
      - name: keywords_last_60d
        description: Raw keyword list for this user's reading in the last 60 days, in the source's custom \term\,\term\ format (not JSON) — parsed downstream via REGEXP_EXTRACT_ALL.

  - name: users_and_collection_recommendations
    description: >
      Long-format (snid, collection_id, title, description) from Snail's
      collection recommendations (snail_recommendation_collections).
      Collections have no existing SNT tagging (unlike journals), so
      title/description are carried through to be embedded downstream.
    columns:
      - name: snid
        description: SN ID.
      - name: collection_id
        description: Snail collection id recommended to this user.
      - name: title
        description: Collection title, as given by Snail — always present.
      - name: description
        description: Collection description (raw, HTML-formatted), as given by Snail — often NULL. Cleaned and combined with title downstream in distinct_collections.
