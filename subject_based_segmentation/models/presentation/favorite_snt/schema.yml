version: 2

models:
  - name: favorite_snt_predictions
    description: >
      Top-10 favorite SNTs per user — nearest SNTs (by cosine distance) to
      their reading-behaviour embedding (user_embedding), ranked 1 (most
      favorite) to 10 via favorite_rank. This is the real product output: an
      SNT-level prediction, not rolled up to MPC. Incremental (merge on
      snid+snt_id), capped at 5k users per run — re-run repeatedly (or on a
      schedule) until it catches up to user_embedding.
    columns:
      - name: snid
        description: SN ID.
      - name: snt_id
        description: A predicted SNT id.
      - name: snt_name
        description: Name of the predicted SNT.
      - name: distance
        description: Cosine distance between the user's embedding and this SNT's embedding — lower means a stronger match.
      - name: favorite_rank
        description: 1 (most favorite, lowest distance) to 10 (least favorite among the top-10), via ROW_NUMBER ordered by distance.

  - name: favorite_snt_predictions_rolled_up_mpc
    description: >
      Each user's top-10 predicted SNTs, rolled up to MPC subject ids via the
      SNT->MKTP mapping table. Exists only to enable
      favorite_snt_evaluation_metrics — there's no other use for
      MPC-rolled-up SNT predictions.
    columns:
      - name: snid
        description: SN ID.
      - name: predicted_mpc_subjects
        description: Deduplicated array of MPC subject ids that this user's top-10 SNTs rolled up to (direct match on the SNT->MKTP mapping table, or fallback match against its 6 hierarchy levels).

  - name: favorite_snt_evaluation_metrics
    description: >
      Precision/recall/F1 of the rolled-up SNT predictions against the real
      MPC ground truth (advertising_opt_in=TRUE users' actual subjects) —
      the same ground truth favorite_mpc_subject/evaluation_metrics.sql
      uses. Indirect validation: there is no SNT-level ground truth to
      compare against directly. Appends one row per dbt run.
    columns:
      - name: run_id
        description: Unique id for this dbt run (the run's invocation_id) — the incremental unique_key.
      - name: run_ts
        description: Timestamp this row was computed. Partition field.
      - name: run_date
        description: Date this row was computed.
      - name: true_positive
        description: Total count, across all evaluated users, of predicted MPC ids that were actually in that user's real subjects.
      - name: false_positive
        description: Total count of predicted MPC ids that were NOT in the user's real subjects.
      - name: false_negative
        description: Total count of the user's real subjects that were NOT among the predicted MPC ids.
      - name: precision
        description: true_positive / (true_positive + false_positive) — of what we predicted, how much was correct.
      - name: recall
        description: true_positive / (true_positive + false_negative) — of the user's real subjects, how much we caught.
      - name: f1_score
        description: Harmonic mean of precision and recall.
      - name: at_least_one_correct_accuracy
        description: Share of evaluated users where at least one predicted MPC id was actually correct.

  - name: favorite_snt_predictions_qa
    description: >
      One row per user for manual spot-checking: journal_ids, journal_titles,
      and their own SNT names, keywords, collection_titles,
      collection_descriptions (the actual text that got embedded, alongside
      title), and collections' own SNT names, and the predicted_snt_names
      (comma-separated, ordered by favorite_rank — most to least favorite)
      side by side — so a reviewer can eyeball whether a prediction makes
      sense given the actual reading-behaviour inputs across all 3 channels.
    columns:
      - name: snid
        description: SN ID.
      - name: journal_ids
        description: Comma-separated list of journal ids this user has any relationship signal with.
      - name: journal_titles
        description: Comma-separated list of those journals' titles.
      - name: journal_snt_names
        description: Comma-separated list of the SNT names those journals resolved to (via journal_snt_codes).
      - name: keywords
        description: Comma-separated list of this user's keywords.
      - name: collection_titles
        description: Comma-separated list of titles of collections recommended to this user.
      - name: collection_descriptions
        description: Pipe-separated list of those collections' HTML-stripped descriptions (only where present).
      - name: collection_snt_names
        description: Comma-separated list of the SNT names those collections resolved to (via collection_snt_confidence).
      - name: predicted_snt_names
        description: Comma-separated list of the predicted top-10 SNT names, ordered from most to least favorite (favorite_rank 1 to 10).
