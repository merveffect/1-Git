version: 2

models:
  - name: snid_to_mktps_step2
    description: >
      Per-SNID aggregation of journal reading behaviour into SNT (S&T taxonomy,
      ~3000 codes) and MPC (marketing preference center, 46 subjects) signals,
      with the top 3 MPC subjects ranked by frequency.
    columns:
      - name: snid
      - name: all_journal_ids
        description: All distinct journal IDs the user has a reading signal for.
      - name: all_snt_codes
        description: All distinct SNT (S&T taxonomy) codes derived from those journals.
      - name: all_snt_labels
        description: Human-readable labels for all_snt_codes.
      - name: all_marketing_ids
        description: All MPC subject IDs the user's SNTs mapped to (pre-ranking).
      - name: all_marketing_preferences
        description: Human-readable labels for all_marketing_ids.
      - name: top_3_marketing_pref_ids
        description: The 3 MPC subject IDs with the highest journal-signal frequency for this SNID.
      - name: top_3_marketing_prefs
        description: Human-readable labels for top_3_marketing_pref_ids.

  - name: cdp_inferred_mpc_subjects
    description: >
      Inferred MPC (marketing preference center, 46-subject) predictions per SNID,
      derived from journal reading behaviour via the SNT->MKTP mapping table.
      This is NOT an SNT-level prediction — SNTs are only an intermediate signal here.
      Physical table name is kept as `cdp_inferred_subjects` (see model alias) for
      backwards compatibility with existing CDP consumers.
    columns:
      - name: snid
      - name: inferred_mpc_subjects
        description: Array of up to 3 inferred MPC subject IDs (INT64) for this user.

  - name: permutive_inferred_mpc_subjects
    description: >
      MPC subject predictions formatted for Permutive's segment feed (one row per
      SNID with space/comma-delimited "isnt<id>" segment strings). Physical alias
      and the "isnt" ID prefix are an existing external contract with Permutive —
      do not change without coordinating with them first.
    columns:
      - name: snid_and_mpc_subjects
        description: "'<snid> isnt<id1>,isnt<id2>,...' — one row per opted-in SNID."

  - name: evaluation_metrics
    description: >
      Precision/recall/F1 of the inferred MPC subject predictions (snid_to_mktps_step2)
      against real ground truth: the MPC subjects users actually opted into via
      advertising_opt_in (audience_builder_big.subjects). Appends one row per dbt run.
