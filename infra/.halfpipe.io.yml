team: dat-analytics-engineering
pipeline: infra
notifications:
  failure:
  - teams: ((teams.defaultd9aabe7c608b4fe1957c0739cb0dfe.22.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/8eabd5183ab24f2a9b5bdadd8c2a4cf2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=zj69VBLjnSFc9B2Im7LHooq5Hi53SfBWWJROGwlWpHI))

  - slack: ((vault "dat-analytics-engineering/teams#DBT_WEBHOOK"))
    message: "❌ Pipeline failed"

feature_toggles:
  - update-pipeline


triggers:
  - type: git
    branch: main 
    uri: git@github.com:springernature/analytics_engineering_dbt.git
    watched_paths:
      - infra

tasks:
  - type: run
    name: plan-dev
    script: plan-terraform.sh
    docker:
      image: eu.gcr.io/halfpipe-io/terraform-vault
    vars:
      TF_ENV_DIR: dev
      GCP_SERVICE_ACCOUNT_INFO: ((dev.dbt_deployer_service_account))

  - type: run
    name: apply-dev
    script: apply-terraform.sh
    manual_trigger: true
    docker:
      image: eu.gcr.io/halfpipe-io/terraform-vault
    vars:
      TF_ENV_DIR: dev
      GCP_SERVICE_ACCOUNT_INFO: ((dev.dbt_deployer_service_account))

  - type: run
    name: plan-prod
    script: plan-terraform.sh
    docker:
      image: eu.gcr.io/halfpipe-io/terraform-vault
    vars:
      TF_ENV_DIR: prod
      GCP_SERVICE_ACCOUNT_INFO: ((prod.dbt_deployer_service_account))

  - type: run
    name: apply-prod
    script: apply-terraform.sh
    manual_trigger: true
    docker:
      image: eu.gcr.io/halfpipe-io/terraform-vault
    vars:
      TF_ENV_DIR: prod
      GCP_SERVICE_ACCOUNT_INFO: ((prod.dbt_deployer_service_account))




