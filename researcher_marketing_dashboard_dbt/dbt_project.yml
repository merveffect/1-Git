name: 'rmdb_dbt'
version: '1.0.0'

profile: 'rmdb_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"


# Added this for the native sources refresh macro to run on every dbt run
on-run-start:
  - "{{ refresh_native_sources() }}"

models:
  +persist_docs:
    relation: true
    columns: true
  rmdb_dbt:
    +tags: rmdb-dbt

    raw:
      +schema: "rmdb_dbt_raw"
      +materialized: table
      +tags:
       - raw
    staging:
      +schema: "rmdb_dbt_staging"
      +materialized: table
      +tags:
        - staging
    presentation:
      +schema: "rmdb_dbt_presentation"
      +materialized: table
      +tags:
        - presentation

vars:
  # backfill_start_date: '2026-06-20'
  # backfill_end_date: '2026-06-20'
  start_date: '2024-01-01'
  end_date: '2026-06-09'







