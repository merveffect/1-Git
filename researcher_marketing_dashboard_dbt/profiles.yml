rmdb_dbt:
  target: dev
  outputs:
    dev:  # gcp environment
      type: bigquery
      method: oauth # can use a SA as authentication too
      project: snproject-cbb9ca25
      dataset: dev # You can also use "schema" here
      threads: 8
      job_execution_timeout_seconds: 8000
      #timeout_seconds: 6000
      location: EU # Optional, one of US or EU
      priority: interactive
      retries: 1
      maximum_bytes_billed: 500000000000  # 500 GB
      
    prod:
      type: bigquery
      method: oauth #can use a SA as authentication too
      project: snproject-cbb9ca25
      dataset: prod # You can also use "schema" here
      threads: 8
      timeout_seconds: 8000
      location: EU # Optional, one of US or EU
      priority: interactive
      retries: 1
      maximum_bytes_billed: 500000000000  # 500 GB query limit

    sandbox:
      type: bigquery
      method: oauth #can use a SA as authentication too
      project: snproject-cbb9ca25
      dataset: sandbox # You can also use "schema" here
      threads: 8
      timeout_seconds: 8000
      location: EU # Optional, one of US or EU
      priority: interactive
      retries: 1
      maximum_bytes_billed: 500000000000  # 500 GB query limit
    

  # target: "{{ env_var('DBT_TARGET', 'dev') }}" 
