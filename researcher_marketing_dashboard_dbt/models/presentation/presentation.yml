version: 2

#j7_AWA uniqueness test
models:

  - name: j7_AWA
    description: >
      Presentation-layer model.
      Combination of all the dimensions should be an unique row.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date
            - campaign
            - clean_campaign
            - main_channels
            - sub_channels
            - country
            - product_code
            - goal_code
            - campaign_code
            - geo_code
            - journal_title
            - oatype
            - journal_id
            - business_model
            - main_discipline
            - main_group
            - portfolio
            - imprint
            - workspace_category
            - research_marketing_activity
            - society_tier
            - name_of_society
          config:
            where: "date >= DATE('2025-01-01')"

    columns:
      - name: date
        description: event date
        data_type: date
        tests:
          - not_null

