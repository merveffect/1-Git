version: 2
 
models:
  - name: j7
    description: "Marketing campaign performance datasource"
 
    columns:
      - name: sub_channels
        description: "More detailed channel grouping than main_channels to differentiate between the topline channel traffic components"
 
      - name: main_channels
        description: "High-level grouping of marketing channels used for topline reporting"
 
      - name: SOURCE
        description: "Traffic source as entered in the utm source field"
 
      - name: date
        description: "Date at which the event occured"
 
      - name: campaign
        description: "Marketing campaign name as entered in the utm campaign field"
 
      - name: clean_campaign
        description: "clean campaign name"
 
      - name: medium
        description: "Traffic medium as entered in the utm medium field"
 
      - name: country
        description: "country where the traffic originated in"
 
      - name: isoalphatwo
        description: "Two letter ISO country code representing each country "
 
      - name: world_region
        description: "Categorization of countries into broader regions based on alignment with stakeholder defined groupings"
 
      - name: audience_code
        description: "4 character Audience code from the campaign naming convention "
 
      - name: product_code
        description: "5 character Product code from the campaign naming convention "
 
      - name: goal_code
        description: "4 character goal code from the campaign naming convention "
 
      - name: campaign_code
        description: "4 character marmind code from the campaign naming convention "
 
      - name: geo_code
        description: "2 character geography/country code of the campaign. This is fetched from the campaign name field"
 
      - name: team_code
        description: "4 character team code which implemented the campaign. Fetched from campaign naming convention "
 
      - name: products
        description: "Categorizes whether a given record belongs to specific product types (Journals, Books, Mixed, or NA) "
 
      - name: journal_title
        description: "Title of the journal"
 
      - name: oatype
        description: "Identifies if a journal is OA, hybrid or closed"
 
      - name: journal_id
        description: "ID of the journal "
 
      - name: business_model
        description: "Marmind business model of the journal "
 
      - name: main_discipline
        description: "Main Discipline of the Journal"
 
      - name: main_group
        description: "Journal group as defined by marketing strategy "
 
      - name: portfolio
        description: "Journal portfolio as defined by marketing strategy "
 
      - name: imprint
        description: "Website from which the traffic was collected "
 
      - name: journal_imprint
        description: "Journal publishing imprint "
 
      - name: engagement_rate
        description: "Ratio of ad clicks to ad impressions in %"
 
      - name: kpi_marbl_leads
        description: "# of book leads coming from MARBL platform. (count of uniquesubmissionID)"
 
      - name: Sessions
        description: "GA4 sessions"
 
      - name: pi_publishing_guidelines
        description: "# of pageview events on the 'publishing guidelines' type pages "
 
      - name: EngagedSessions
        description: "GA4 defined engaged sessions (a session that lasts longer than 10 seconds, has a conversion event, or has at least 2 pageviews or screenviews)"
 
      - name: ELS
        description: "# of engagement leading to submission key event conversions (event count)"
 
      - name: snapp_submission_complete
        description: " "
 
      - name: content_consumption
        description: "# of content consumption event conversions (event count)"
 
      - name: reach_india_apc_thankyou
        description: "# of 'reach_india_apc_thankyou' event conversions (event count)"
 
      - name: reach_oa_general
        description: "# of 'reach_oa_general' event conversions (event count)"
 
      - name: snapp_submission_start
        description: " "
 
      - name: kpi_submit_click
        description: "# of clicks on the 'Submit' button on the research websites"
 
      - name: pi_reach_fta
        description: "# of pageview events to full text article pages"
 
      - name: kpi_reach_submission_guideline_pages
        description: "# of pageview events on the 'submission guidelines' type pages"
 
      - name: kpi_reach_about_pages
        description: "# of pageview events on the 'about the journal' type pages"
 
      - name: pi_contact_an_editor
        description: "# of pageiew events on the 'contact en editor' type pages "
 
      - name: kpi_submit_your_book_idea
        description: "# of clicks on the 'submit your book idea' button on Springer and Palgrave websites"
 
      - name: reach_b2c_blog_page
        description: "# of pageview events on the b2c blog pages "
 
      - name: ta_file_download
        description: "# of click events on some buttons (Author guide, pdf download, eligible journals) on OA pages on springernature.com"
 
      - name: search_volume
        description: "Total number of sessions coming from SEO"
 
      - name: journal_engagement
        description: "# sessions on journal pages excluding article pages, but every other page"
 
      - name: research_article_readership
        description: "# research_article_readership key event conversions (event count)"
 
      - name: source_readership
        description: "# source_readership key event conversions (event count)"
 
      - name: ejp_submission_start
        description: " "
 
      - name: ejp_submission_complete
        description: " "
 
      - name: nav_sign_up_for_alerts
        description: " "
 
      - name: signup_etoc
        description: "Sign-up to eToc Alerts (no GA4)"
 
      - name: cost
        description: "Ad cost "
 
      - name: clicks
        description: "Number of times users interacted with the ad by clicking on it"
 
      - name: impressions
        description: "Number of times the ad was viewed by users "
 
      - name: researchER_marketing_activity
        description: "Boolean flag indicating whether the campaign is a researchER marketing campaign (true) or not (false)"
 
      - name: research_marketing_activity
        description: "Boolean flag indicating whether the campaign is a research marketing campaign (true) or not (false)"
 
      - name: naming_convention_correct
        description: "Boolean flag indicating whether the campaign follows the defined naming convention (true) or not (false) "
 
      - name: nature_grp
        description: "nature group portfolio values "
 
      - name: is_oax
        description: "Boolean flag indicating whether the journal is Open Access (true) or not (false)"
 
      - name: id
        description: "campaign id "
 
      - name: status
        description: "status of the campaign - fetched from marmind"
 
      - name: campaign_category
        description: "category of campaign -  fetched from marmind"
 
      - name: name
        description: "campaign name - fetched from marmind"
 
      - name: target_audience_name
        description: "Audience names targeted by that specific campaign - fetched from marmind "
 
      - name: validity_from
        description: "Start date from which the campaign is considered active or valid"
 
      - name: validity_to
        description: "End date until which the campaign remains active or valid"
 
      - name: archived
        description: "Boolean flag indicating whether the campaign is archived (true) or not (false) "
 
      - name: workspace_category
        description: "Marmind workspace category of the campaign "
 
      - name: workspace_name
        description: "Marmind workspace name which the campaign belongs to "
 
      - name: primary_campaign_goal
        description: "Primary goal of the campaign - fetched from marmind "
 
      - name: marmind_campaign_code
        description: "Unique marmind code of the campaign "
 
      - name: description
        description: "Short description of the campaign "




