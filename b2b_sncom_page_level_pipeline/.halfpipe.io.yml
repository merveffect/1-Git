team: dat-analytics-engineering
pipeline: b2b_sncom_page_level_pipeline_dbt
#notifications:
#  failure:
#    - teams: ((teams.workflow_url))
feature_toggles:
  - update-pipeline
 
triggers:
  - type: git
    branch: main
    watched_paths:
      - b2b_sncom_page_level_pipeline
 
 
tasks:
 
  - type: run
    name: deploy-dev
    script: dbt run --target dev
    docker:
      image: eu.gcr.io/halfpipe-io/sn-dbt-0.2
    vars:
      GCP_PROJECT: snproject-cbb9ca25
      GCP_SERVICE_ACCOUNT_INFO: ((dev.dbt_deployer_service_account))
 
  - type: run
    name: deploy-prod
    script: dbt run --target prod --full-refresh
    docker:
      image: eu.gcr.io/halfpipe-io/sn-dbt-0.2
    vars:
      GCP_PROJECT: snproject-cbb9ca25
      GCP_SERVICE_ACCOUNT_INFO: ((prod.dbt_deployer_service_account))