name: 'institutional_web_analytics'
version: '1.0.0'
config-version: 2

profile: 'institutional_web_analytics' 

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: 
  - "target"
  - "dbt_packages"

models:
  institutional_web_analytics:
    +dataset: "{{ 'dbt_institutional_web_analytics_dev' if target.name == 'dev' else 'dbt_institutional_web_analytics_prod' }}"
    
    staging:
      +materialized: view
      +tags: ["daily"]
      
      ga4: 
        +materialized: incremental
    
    intermediate:
      +materialized: view
      +tags: ["daily"]
      
      ga4:
        +materialized: incremental
    
    marts:
      +materialized: table
      analytics:
        +materialized: incremental
        +tags: ["monthly"]

vars:
  target_dataset: "{{ 'dbt_institutional_web_analytics_dev' if target.name == 'dev' else 'dbt_institutional_web_analytics_prod' }}"