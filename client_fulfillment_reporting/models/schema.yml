version: 2

models:
  - name: bc_collections_megatable
    description: Final collections reporting table at the evt_date, page_path, and collection_id grain.

  - name: raw_bc_collections_article_google_sheets_metadata
    description: Raw Google Sheets metadata for BC collections articles.

  - name: raw_ga4_base_event_data
    description: Raw GA4 base event-level data ingested for collections reporting.

  - name: raw_ga4_base_pageview_data
    description: Raw GA4 base pageview-level data ingested for collections reporting.

  - name: raw_ga4_user_logs
    description: Raw GA4 user log records used for downstream collections models.

  - name: raw_workfront_metadata
    description: Raw Workfront metadata table used for project details.

  - name: stg_collections_ga_events
    description: Staging table that aggregates GA4 event metrics by page_path and evt_date.

  - name: stg_collections_ga_pageview
    description: Staging table that aggregates GA4 pageview metrics by page_path, evt_date, and collection_id.

  - name: stg_collections_ga_users
    description: Staging table that aggregates GA4 user identifiers by page_path and evt_date.

  - name: stg_ga4_exploded_collection_ids
    description: Staging table that explodes semicolon-delimited collection IDs from GA4 pageview data.

  - name: stg_gsheet_wf_metadata
    description: Staging table with deduplicated Google Sheets Workfront metadata by page_path and collection_id.