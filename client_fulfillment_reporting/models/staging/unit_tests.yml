unit_tests:
  - name: test_no_collection_model_includes_all_null_or_empty_cid_gsheet_page_paths
    model: bc_gsheet_no_collection_megatable
    description: >
      Ensures every page_path from stg_gsheet_wf_metadata with NULL or empty
      collection_id appears in bc_gsheet_no_collection_megatable.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_gsheet_wf_metadata')
        rows:
          - {page_path: '/p-null', collection_id: null, collection_title: 'Title Null', full_article_url: 'https://example.com/p-null', page_title: 'P Null'}
          - {page_path: '/p-empty', collection_id: '', collection_title: 'Title Empty', full_article_url: 'https://example.com/p-empty', page_title: 'P Empty'}
          - {page_path: '/p-has-cid', collection_id: 'COL_123', collection_title: 'Has CID', full_article_url: 'https://example.com/p-has-cid', page_title: 'P Has CID'}

      - input: ref('stg_collections_ga_pageview_no_collection_id')
        rows:
          - {page_path: '/p-null', evt_date: '2026-07-01', pageview_data: ["struct(100 as total_engaged_ms, 1 as pageview_count, 1 as session_count, 'TR' as country, 'desktop' as device_category, 'google' as aq_source, 'google' as aq_source_sess, 'P Null' as pageTitle)"]}
          - {page_path: '/p-empty', evt_date: '2026-07-01', pageview_data: ["struct(200 as total_engaged_ms, 2 as pageview_count, 1 as session_count, 'GB' as country, 'mobile' as device_category, 'direct' as aq_source, 'direct' as aq_source_sess, 'P Empty' as pageTitle)"]}

      - input: ref('stg_collections_ga_events')
        rows:
          - {page_path: '/p-null', evt_date: '2026-07-01', event_data: ["struct('download' as event_name, 'engagement' as event_category, 'click' as event_action, 'cta' as event_label, 50 as percent_scrolled, 1 as event_count, 'TR' as country, 'desktop' as device_category, 'https://example.com' as link_url, 'google' as aq_source, 'button' as link_text)"]}
          - {page_path: '/p-empty', evt_date: '2026-07-01', event_data: ["struct('view' as event_name, 'engagement' as event_category, 'scroll' as event_action, 'body' as event_label, 80 as percent_scrolled, 1 as event_count, 'GB' as country, 'mobile' as device_category, 'https://example.com/p-empty' as link_url, 'direct' as aq_source, 'link' as link_text)"]}

      - input: ref('stg_collections_ga_users')
        rows:
          - {page_path: '/p-null', evt_date: '2026-07-01', user_data: ["struct('U1' as user_pseudo_id)"]}
          - {page_path: '/p-empty', evt_date: '2026-07-01', user_data: ["struct('U2' as user_pseudo_id)"]}

      - input: ref('raw_workfront_metadata')
        rows:
          - {page_url: 'https://example.com/p-null', workfront_project_id: 'WF1', workfront_project_name: 'Project 1', client_name: 'Client A', collection_title: 'WF Title'}
          - {page_url: 'https://example.com/p-empty', workfront_project_id: 'WF2', workfront_project_name: 'Project 2', client_name: 'Client B', collection_title: null}

    expect:
      rows:
        - {evt_date: '2026-07-01', page_path: '/p-null', gsheet_collection_id: null}
        - {evt_date: '2026-07-01', page_path: '/p-empty', gsheet_collection_id: ''}
