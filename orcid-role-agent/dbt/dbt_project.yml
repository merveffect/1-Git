name: 'orcid_role_agent'
version: '1.0.0'
config-version: 2
profile: 'orcid_role_agent'

model-paths:   ["models"]
macro-paths:   ["macros"]
seed-paths:    ["seeds"]
analysis-paths: ["analyses"]
target-path:   "target"
clean-targets: ["target", "dbt_packages"]

models:
  orcid_role_agent:
    +persist_docs: {relation: true, columns: true}
    raw:          {+materialized: view,  +schema: raw}
    staging:      {+materialized: view,  +schema: staging}
    dictionary:   {+materialized: table, +schema: dictionary}
    scoring:      {+materialized: table, +schema: scoring}
    presentation: {+materialized: table, +schema: presentation}

seeds:
  orcid_role_agent:
    +schema: seeds

vars:

  # ───────────────────────────────────────────────────────────────────────
  # 1. PROJECTS
  #
  #   READ (sources are declared in models/raw/_sources.yml):
  #     researcher-360-prod-e7fd74be   ORCID + CDP
  #     ri-data-engineering-dd4c0eca   ROR registry
  #     datasn-rm-live                 embedding model
  #
  #   WRITE (profiles.yml -> project / dataset):
  #     dat-analytics-eng-ec869189 . orcid_role_agent
  #       -> orcid_role_agent_raw / _staging / _dictionary
  #          _scoring / _presentation / _seeds
  # ───────────────────────────────────────────────────────────────────────
  target_project:   'dat-analytics-eng-ec869189'

  # ⚠️ ORCID carries per-record visibility: PUBLIC / LIMITED /
  # REGISTERED_ONLY / PRIVATE. The filter is applied once in the raw
  # layer. Get legal sign-off before setting this to false.
  public_visibility_only: true

  # ───────────────────────────────────────────────────────────────────────
  # COST TIERS
  # The frequency distribution is heavily skewed, so treating every
  # distinct title identically is wasteful.
  #   A: frequent   -> full processing + human review queue
  #   B: mid        -> full processing
  #   C: long tail  -> vector only, never enters the review queue
  # Tune these after running analyses/00_source_profile.sql query J.
  # ───────────────────────────────────────────────────────────────────────
  tier_a_min_frequency: 50
  tier_b_min_frequency: 3

  # ───────────────────────────────────────────────────────────────────────
  # 2. VERTEX AI
  # ───────────────────────────────────────────────────────────────────────
  # No new connection needed - a remote model already exists in another
  # project. Cross-project read access to datasn-rm-live is required.
  # Multilingual behaviour was verified in setup/03_test_access.sql
  # (Test 1b): cardiologue 0.928 / Facharzt 0.795 / kardiyolog 0.760
  # vs the unrelated control librarian 0.572.
  embedding_model:    'datasn-rm-live.institution_disambiguation.embedding_model'
  vertex_connection:  'EU.vertex_ai_conn'   # only needed for the LLM judge
  judge_model:        'gemini-2.5-flash'

  # How to call an LLM from BigQuery. Both routes use the SAME Vertex
  # connection; only the SQL syntax differs.
  #   'ai_generate_bool'  -> AI.GENERATE_BOOL, concise, regional support varies
  #   'ml_generate_text'  -> ML.GENERATE_TEXT, available everywhere (safe harbour)
  # setup/03_test_access.sql tells you which one works here.
  judge_function:     'ai_generate_bool'

  # ───────────────────────────────────────────────────────────────────────
  # THRESHOLDS - CALIBRATED via analyses/02_similarity_calibration.sql
  #
  # FINDING: absolute similarity does NOT separate the classes.
  #   true matches   0.682 - 1.000
  #   false matches  0.519 - 0.953      <-- heavy overlap
  #
  # WHAT DOES SEPARATE THEM: the DISTRACTOR MARGIN. How much closer is
  # the title to a target role than to common non-target occupations
  # (the '__distractor' anchors)?
  #   true matches   lowest margin   +0.13
  #   false matches  mostly NEGATIVE, highest +0.12
  # The threshold sits between the two.
  # ───────────────────────────────────────────────────────────────────────

  # PRIMARY DECISION MEASURE: role similarity minus distractor similarity
  sim_min_margin:   0.13

  # Floor filter. The margin does the real work; this only drops
  # very weak matches up front.
  sim_floor:        0.65

  # MULTI-LABEL TIE BAND
  # "Professor of Cardiology" should be both hcp and researcher.
  # Every role within this distance of the best role is accepted.
  # The runner-up is not penalised - both can be true at once.
  sim_tie_band:     0.12

  # A margin below this makes the decision fragile -> human review queue
  sim_review_margin: 0.18

  # Education bonus split. Phase-1 used an even 0.5 / 0.5, but the degree
  # field mostly encodes academic LEVEL (phd, master, bachelor) rather
  # than subject - measured over 23M records in
  # analyses/04_degree_coverage.sql. The subject lives in the department.
  education_degree_weight: 0.3
  education_dept_weight:   0.7

  # The LLM judge is OPTIONAL. This project has no Vertex connection
  # (Test 3: "Not found: Connection vertex_ai_conn"), so it defaults to
  # off and the pipeline runs on vectors alone. Flip to true once a
  # connection exists.
  use_llm_judge:    false

  # ───────────────────────────────────────────────────────────────────────
  # 3. ROLE REGISTRY  ⭐
  #
  #    ADDING A ROLE = one block here + a few rows in
  #    seeds/role_anchors.csv. NO other file is touched.
  #    To retire a role: enabled: false (never delete - it breaks history)
  # ───────────────────────────────────────────────────────────────────────
  roles:

    hcp:
      # Braze contract: role_inferred carries this exact string. It must
      # match the spelling in the MPC 'role' field EXACTLY, otherwise the
      # segment splits in two.
      display_name: 'Healthcare Professional'
      detail_dimension: bucket        # second part of role_detailed_inferred
      enabled: true
      label: 'Healthcare Professional'
      axis: profession
      description: >
        People delivering clinical care, conducting health research, or
        leading a healthcare organisation. Continues the definition from
        the Phase-1 HCP document.
      isco_groups: ['22']
      weights:         {role: 0.50, org: 0.30, dept: 0.20}
      education_bonus: 0.20
      thresholds:      {confirmed: 0.60, probable: 0.30}
      current_only:    false
      buckets: ['PRACTITIONER', 'HCP_RESEARCHER', 'ADMINISTRATOR']

    pharmacist:
      display_name: 'Pharmacist'
      detail_dimension: setting
      enabled: true
      label: 'Pharmacist'
      axis: profession
      description: >
        Pharmacists across hospital, community, clinical and industrial
        practice. A separate audience that ALSO rolls up into
        HCP / PRACTITIONER.
      isco_groups: ['2262']
      parent:        'hcp'            # the same person is also written as hcp
      parent_bucket: 'PRACTITIONER'
      weights:         {role: 0.60, org: 0.25, dept: 0.15}
      education_bonus: 0.20
      thresholds:      {confirmed: 0.60, probable: 0.30}
      current_only:    false

    librarian:
      display_name: 'Librarian'
      detail_dimension: org_type
      enabled: true
      label: 'Librarian / Information Professional'
      axis: profession
      description: >
        Academic and research librarians, subject and liaison librarians,
        scholarly communications and open access staff, repository and
        e-resources managers, heads of library services and library
        directors. Different commercial purpose from the other roles:
        institutional sales and licence renewal.
      isco_groups: ['2622']
      weights:         {role: 0.70, org: 0.20, dept: 0.10}
      education_bonus: 0.00           # an LIS degree is not required
      thresholds:      {confirmed: 0.60, probable: 0.35}
      current_only:    true           # institutional sales needs a CURRENT post

    researcher:
      display_name: 'Researcher'
      detail_dimension: org_type
      enabled: true
      label: 'Researcher (all fields)'
      axis: position
      description: >
        Researchers in ALL fields - NOT restricted to health.
        Postdoc, research fellow, PI, research scientist, research associate.
      isco_groups: ['21', '213', '2131']
      weights:         {role: 0.70, org: 0.20, dept: 0.10}
      education_bonus: 0.00
      thresholds:      {confirmed: 0.60, probable: 0.30}
      current_only:    false

    faculty_head:
      display_name: 'Head of Faculty'
      detail_dimension: org_type
      enabled: true
      label: 'Head of Faculty / Department'
      axis: position
      description: >
        Deans, heads of department, institute directors, pro vice
        chancellors and provosts.
      isco_groups: ['1345']
      weights:         {role: 0.60, org: 0.20, dept: 0.20}
      education_bonus: 0.00
      thresholds:      {confirmed: 0.65, probable: 0.40}
      current_only:    true           # a temporary post - current records only

    # ─── QUEUED FOR LATER ──────────────────────────────────────────────
    lecturer:
      display_name: 'Lecturer'
      detail_dimension: org_type
      enabled: false                  # flip to true, dbt run, done
      label: 'Lecturer / Teaching Academic'
      axis: position
      description: >
        Teaching academics. CAUTION: a UK "Lecturer" is roughly a US
        "Assistant Professor". Country-aware mapping is needed, which is
        why this role is deferred.
      isco_groups: ['231', '2310']
      weights:         {role: 0.70, org: 0.20, dept: 0.10}
      education_bonus: 0.00
      thresholds:      {confirmed: 0.60, probable: 0.30}
      current_only:    false

  # ───────────────────────────────────────────────────────────────────────
  # 4. BRAZE DATA CONTRACT
  # ───────────────────────────────────────────────────────────────────────
  contract:
    # The lawful basis for contacting a person.
    #   'marketing_opt_in'     -> mkt_pref_opt_in = TRUE only   (~24%)
    #   'legitimate_interest'  -> every contact present in CDP  (~96%)
    #   'both'                 -> both, separated by consent_basis column
    # Safe default while the DPO decision is pending: marketing_opt_in.
    consent_basis: 'marketing_opt_in'

    # Which labels are allowed into the role_inferred array.
    include_labels: ['CONFIRMED']         # adding 'PROBABLE' roughly doubles volume

    # Array ordering. All four arrays are derived from the SAME order.
    #   'alphabetical' -> the starting point stated in the contract
    #   'score'        -> most confident role first (recommended)
    array_order: 'alphabetical'

    # Joiner for role_detailed_inferred. The contract example showed two
    # different formats; we standardised on one.
    detail_separator: ' - '

    # Joiner when the same role is asserted by more than one source
    detail_source_separator: ' + '

  # ───────────────────────────────────────────────────────────────────────
  # 5. DATA SOURCES
  #
  # There is one source today: ORCID. When web scraping arrives it is a
  # UNION ALL in stg_role_records plus one WHEN branch in
  # fct_braze_contact_roles for its display name. Nothing is abstracted
  # ahead of that - the shape of the second source is not known yet.
  # ───────────────────────────────────────────────────────────────────────

  # ───────────────────────────────────────────────────────────────────────
  # 6. NORMALISATION - abbreviation expansion rules
  #    Applied in order. A new rule is a new line.
  # ───────────────────────────────────────────────────────────────────────
  abbreviations:
    - {from: '\bprof\b',        to: 'professor'}
    - {from: '\bassoc\b',       to: 'associate'}
    - {from: '\basst\b',        to: 'assistant'}
    - {from: '\bsr\b',          to: 'senior'}
    - {from: '\bjr\b',          to: 'junior'}
    - {from: '\bdept\b',        to: 'department'}
    - {from: '\bdiv\b',         to: 'division'}
    - {from: '\bdir\b',         to: 'director'}
    - {from: '\bmgr\b',         to: 'manager'}
    - {from: '\bres\b',         to: 'research'}
    - {from: '\bsci\b',         to: 'scientist'}
    - {from: '\bphys\b',        to: 'physician'}
    - {from: '\bpharm\b',       to: 'pharmacy'}
    - {from: '\bmed\b',         to: 'medical'}
    - {from: '\bclin\b',        to: 'clinical'}
    - {from: '\buniv\b',        to: 'university'}
    - {from: '\bhosp\b',        to: 'hospital'}
    - {from: '\blib\b',         to: 'library'}
    - {from: '\bpi\b',          to: 'principal investigator'}
    - {from: '\bpdra\b',        to: 'postdoctoral research associate'}
    - {from: '\bpost doc\b',    to: 'postdoc'}
    - {from: '\bpost-doc\b',    to: 'postdoc'}
