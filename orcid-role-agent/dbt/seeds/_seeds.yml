version: 2

seeds:
  - name: role_anchors
    description: >
      Core anchor terms per role. VECTOR_SEARCH runs against these.
      polarity=exclude cuts false positives (the vector equivalent of the
      Phase-1 "data consultant" rule). Add rows here when adding a role.
      '__distractor' is a pseudo-role holding common occupations that are
      none of our targets; it is the reference point the decision rule
      measures against.
    config:
      column_types: {role_key: STRING, anchor_term: STRING, polarity: STRING, language_code: STRING, note: STRING}
    columns:
      - name: role_key
        description: >
          Target roles plus '__distractor'. Calibration showed the
          deciding measure is not "how similar is this title to the role"
          but "how much MORE similar is it to the role than to unrelated
          occupations".
        tests:
          - not_null
          - accepted_values:
              values: "{{ role_keys() + ['__distractor'] }}"
      - name: polarity
        tests:
          - accepted_values: {values: ['include', 'exclude']}

  - name: org_type_scores
    description: >
      (role, ROR organisation type) -> org score. Replaces the Phase-1
      organisation regex gradient. Because the type comes from ROR,
      variants like "St. Mary's Hosp." are no longer missed.
    config:
      column_types: {role_key: STRING, org_type: STRING, org_score: FLOAT64, note: STRING}

  - name: dept_signals
    description: (role, department regex) -> dept score.
    config:
      column_types: {role_key: STRING, dept_pattern: STRING, dept_score: FLOAT64, note: STRING}

  - name: education_signals
    description: (role, degree/department regex) -> education bonus component.
    config:
      column_types: {role_key: STRING, signal_type: STRING, pattern: STRING, degree_score: FLOAT64, note: STRING}

  - name: role_detail_map
    description: >
      Rules producing the second part of role_detailed_inferred.
      match_type='title' matches the job title, match_type='org_type'
      matches the ROR organisation type. Lowest priority wins.
    config:
      column_types: {role_key: STRING, match_type: STRING, match_value: STRING, detail_label: STRING, priority: INT64, note: STRING}
    columns:
      - name: role_key
        tests:
          - accepted_values: {values: "{{ role_keys() }}"}
      - name: match_type
        tests:
          - accepted_values: {values: ['title', 'org_type']}

  - name: role_title_overrides
    description: >
      HUMAN DECISIONS. Always beat the vector and LLM decisions.
      Filled in after working through rpt_title_review_queue.
    config:
      column_types: {title: STRING, role_key: STRING, decision: STRING, reviewer: STRING, reviewed_at: DATE, note: STRING}
    columns:
      - name: decision
        tests:
          - accepted_values: {values: ['ACCEPT', 'REJECT']}
