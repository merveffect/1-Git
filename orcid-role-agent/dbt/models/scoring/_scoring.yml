version: 2

models:
  - name: fct_researcher_roles
    description: >
      ⭐ THE CORE MODEL. One row = (snid, role_key).
      Multi-label: a person can hold several roles. The whole
      presentation layer is built from this table.
    columns:
      - name: snid
        tests: [not_null]
      - name: role_key
        tests:
          - not_null
          - accepted_values: {values: "{{ role_keys() }}"}
      - name: source_key
        tests: [not_null]
      - name: role_label
        tests:
          - accepted_values: {values: ['CONFIRMED', 'PROBABLE']}
      - name: role_final_score
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1.2, inclusive: true}
      - name: role_detail
        description: The second part of role_detailed_inferred.
      - name: derived_from_role
        description: Source role when this row came from a roll-up (e.g. pharmacist -> hcp).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snid, role_key]
