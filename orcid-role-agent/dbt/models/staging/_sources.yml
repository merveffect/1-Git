version: 2

sources:
  - name: researcher_profiles
    database: researcher-360-prod-e7fd74be
    schema: researcher_profiles
    description: ORCID arastirmaci profilleri. Ic ice (nested/repeated) sema.
    tables:
      - name: orcid_researchers
        description: >
          Bir satir = bir kisi. employments / educations / publications /
          keywords / peer_reviews REPEATED STRUCT olarak tutulur.
          Rol bilgisi: employments[].role  (serbest metin, cok dilli)
        columns:
          - name: snid
            description: Springer Nature kullanici tanimlayicisi.
            tests: [not_null]
          - name: orcid_id
            tests: [not_null]

  - name: cdp
    database: researcher-360-prod-e7fd74be
    schema: researcher_profiles
    tables:
      - name: audience_builder_big
        description: CDP opt-in populasyonu ve consent bayraklari.

  - name: ror
    database: ri-data-engineering-dd4c0eca
    schema: ror
    description: >
      ROR kurum kayit defteri. AYRI PROJE - cross-project okuma izni gerekir.
    tables:
      - name: ror_data_refresh
        description: >
          ROR registry dump. Kurum tipi (Education / Healthcare / Company /
          Archive / Nonprofit / Government / Facility / Other) buradan gelir.
          !! Kolon adlari dogrulanacak - ROR semasi surumlere gore degisiyor.
