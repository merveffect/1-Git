name: Nature Value Proposition

on:
  workflow_dispatch:

   schedule:
    # 2:00 PM IST on the 15th of every month
    - cron: "30 8 15 * *"

jobs:
  run-python-process:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r nature_value_proposition_python/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/592557465902/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "nvp-python-github@snproject-cbb9ca25.iam.gserviceaccount.com"

      - name: Run Python process
        run: |
          python nature_value_proposition_python/generate_slide_sections.py