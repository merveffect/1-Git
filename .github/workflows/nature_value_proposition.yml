name: Nature Value Proposition

on:
  workflow_dispatch:

jobs:
  generate-slide-sections:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nature_value_proposition_python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python process
        run: |
          python generate_slide_sections.py