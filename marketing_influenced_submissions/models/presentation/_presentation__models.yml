version: 2

models:
  - name: repeated_author_flag
    description: >
      SNAPP power-author dashboard output (Colab `repeated_author_flag`). Confirmed by
      Giorgia (2026-07-16) as a direct dashboard dependency. One row per
      (internal_submission_id, source_system); column-for-column with prod
      `RM_Submissions_mktg_infl.repeated_author_flag`.
    columns:
      - name: internal_submission_id
        description: Submission identifier (STRING). One flag per submission per source_system.
        data_tests:
          - not_null
      - name: source_system
        description: Source pipeline (e.g. SNAPP / EM), from the submissions spine.
        data_tests:
          - not_null
      - name: month
        description: Submission month (DATE, month-truncated).
      - name: repeated_author
        description: >
          1 if at least one author on the submission had previously submitted (full-history
          lookback up to the submission date when repeated_author_full_history is on);
          0 if all authors are brand new.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
