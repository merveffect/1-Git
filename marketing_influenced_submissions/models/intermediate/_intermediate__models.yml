version: 2

models:
  - name: int_authors
    description: >
      Layer 1 author backbone (Colab `mis_1_authors`). One row per submission x
      author (all roles kept: submitter / coauthor / corresponding), for SNAPP and
      EM submissions in the processing window, enriched with journal imprint and
      portfolio metadata. Incremental by submission_date month (insert_overwrite).
    columns:
      - name: submission_id
        description: Core submission ID (kept for joins/tests; dropped in the Colab).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_submissions')
                field: submission_id
      - name: internal_submission_id
        description: Source-system submission ID (join key to GA4/outside-core data).
        data_tests:
          - not_null
      - name: source_system
        description: Origin system. SNAPP or EM only in this model (matches the Colab filter).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SNAPP', 'EM']
      - name: submission_date
        description: Submission received date (partition key).
        data_tests:
          - not_null
      - name: journal_id
        description: Springer Nature journal ID (string).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_journals')
                field: journal_id
      - name: author_email
        description: Author email (primary identity key; nullable when the author row is missing).

  - name: int_repeated_author_flag
    description: >
      Layer 1 repeated-author flag (Colab `repeated_author_flag`). One row per
      submission (internal_submission_id x source_system) with repeated_author = 1
      when any author appeared on an earlier submission WITHIN the processed window.
      Author identity = COALESCE(author_email, snid, author_id). Incremental by month.
    columns:
      - name: internal_submission_id
        description: Source-system submission ID. Expected unique (no cross-system collision).
        data_tests:
          - not_null
          - unique
      - name: month
        description: First day of the submission month (partition key).
        data_tests:
          - not_null
      - name: repeated_author
        description: 1 if any author was seen on an earlier submission in-window, else 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
