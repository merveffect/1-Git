version: 2

models:
  - name: stg_cdp_user_identifiers
    description: Active CDP identifiers (canonical_segment_id, type, value).
    columns:
      - name: canonical_segment_id
        description: CDP canonical segment id (join key for email <-> ga_client_id).
      - name: type
        description: Identifier type (email, ga_client_id, ...).

  - name: stg_smc_author_behavior
    description: SMC author behaviour; SAP outbound id (36 chars) -> author_email.
    columns:
      - name: author_email
        description: Author email associated with the SAP outbound id.
      - name: sap_outbound_id_36
        description: First 36 chars of interaction_source_object (SAP outbound id).

  - name: stg_braze_interactions
    description: Braze email_click interactions; user_id (cep_id) -> email_address.
    columns:
      - name: user_id
        description: Braze user id, equal to the GA4 cep_id.
      - name: email_address
        description: Email address for the Braze contact.

  - name: stg_researcher_email_lookup
    description: Researcher email lookup (email -> researcher_id).
    columns:
      - name: researcher_id
        description: Researcher id (join key to researcher profiles).
      - name: email
        description: Researcher email.

  - name: stg_researcher_profiles
    description: Researcher profiles; researcher_id -> 5yr author group.
    columns:
      - name: researcher_id
        description: Researcher id.
      - name: total_amt_5yr_author_group
        description: 5-year author group used to classify power authors.

  - name: stg_marmind
    description: >
      Marmind campaign metadata from prod_marmind_presentation.marmind_analytics
      (code -> workspace_category). channels_categories removed with the Jun-2026
      source swap (Colab hardcodes 'N/A' downstream).
    columns:
      - name: marmind_campaign_code
        description: Marmind campaign code (join key to GA marmind_code).
      - name: workspace_category
        description: Workspace category (Authors / India / New Launches / Collections / …).

  - name: stg_snapp_submission_funnel
    description: SNAPP funnel; GA-observed submissions (submission_id -> user_pseudo_id).
    columns:
      - name: submission_id
        description: SNAPP submission id (maps to internal_submission_id downstream).
      - name: user_pseudo_id
        description: GA4 user pseudo id.
      - name: snapp_process
        description: Funnel process stage (filtered to snapp_success downstream).

  - name: stg_author_profiles
    description: SDM author profiles (author_email -> author_country).
    columns:
      - name: author_email
        description: Author email.
      - name: author_country
        description: Author country.

  - name: stg_rpt_stage_history
    description: Articles pipeline stage history (internal_submission_id -> stage_id).
    columns:
      - name: internal_submission_id
        description: Source-system submission id.
      - name: stage_id
        description: Pipeline stage id (5 = out to review).

  - name: stg_j7
    description: GA4 j7 sessions by campaign x channel.
    columns:
      - name: clean_campaign
        description: Cleaned campaign name (join key to Google auto activity).
      - name: sessions
        description: Session count (PascalCase Sessions in source).
