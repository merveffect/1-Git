version: 2

models:
  - name: stg_submissions
    description: >
      Cleaned core submissions: one row per submission (latest view). Column subset
      used by the MIS pipeline, with submission_date cast to DATE and the Colab
      is_in_collection flag derived from collection_id.
    columns:
      - name: submission_id
        description: Submission ID (join key within core). Expected unique in the latest view.
        data_tests:
          - not_null
          - unique
      - name: internal_submission_id
        description: Submission ID in the source system; join key to datasets outside core.
        data_tests:
          - not_null
      - name: source_system
        description: Origin system of the submission.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SNAPP', 'EJP', 'EM']
      - name: submission_date
        description: Submission received date (cast from timestamp).
        data_tests:
          - not_null
      - name: journal_id
        description: Springer Nature journal ID (string in core).

  - name: stg_authors
    description: >
      Cleaned authors/co-authors per submission. author_roles struct flattened into
      is_submitter / is_coauthor / is_corresponding_author booleans.
    columns:
      - name: submission_id
        description: Submission ID this author is attached to.
        data_tests:
          - not_null
      - name: author_email
        description: Author email address (primary MIS identity key).
      - name: source_system
        description: Origin system of the author record.
        data_tests:
          - accepted_values:
              arguments:
                values: ['SNAPP', 'EJP', 'EM']

  - name: stg_journals
    description: Cleaned journal metadata (imprint, publishing model, title).
    columns:
      - name: journal_id
        description: Springer Nature journal ID.
        data_tests:
          - not_null
          - unique
      - name: imprint_code
        description: Short imprint code (e.g. BMCE).

  - name: stg_channel_groupings
    description: >
      RM Channel Groupings reference (raw passthrough of the native table
      ae_metadata.channel_groupings_native, ~807 rows). Maps GA4 source/medium/
      adnetwork to sub_channels / main_channels. Normalisation is deferred to the
      Layer 3 GA4 join per the Colab. NB: main_channels has casing/whitespace
      variants ("Email " vs "Email", "Other channels" vs "Other Channels") — do
      NOT add accepted_values until the canonical set is confirmed with SN.
    columns:
      - name: main_channels
        description: High-level channel grouping (raw; has casing/space variants).
      - name: sub_channels
        description: Detailed channel grouping.
