name: marketing_influenced_submissions
version: 1.0.0

profile: marketing_influenced_submissions

model-paths:
  - models
test-paths:
  - tests
macro-paths:
  - macros
target-path: target

clean-targets:
  - target
  - dbt_packages

# Monthly processing window for the MIS pipeline. Override per run, e.g.:
#   dbt build --vars '{mis_start_date: 2026-06-01, mis_end_date: 2026-06-30}'
# Incremental models use insert_overwrite on the month partition, so re-running a
# month replaces that partition idempotently. Default = May 2026 (Colab benchmark
# month: 307,176 SNAPP+EM submissions).
#
# SN-REVIEW: every var below encodes an assumption ported from the Colab that the
# client must confirm. Defaults reproduce current Colab behaviour. Giorgia confirmed
# (2026-07-16) that the deprecated identity tables must STAY in the union — even though
# they are no longer refreshed, their historical client_id<->email mappings are still
# useful — so all identity_include_* branches default ON. See docs/assumptions-register.md.
vars:
  mis_start_date: '2026-05-01'
  mis_end_date: '2026-05-31'

  # --- Identity resolution (Phase 1B): which email -> client_id branches feed the
  # combined identity union (Colab mis_2_email_clientid_v3). Giorgia (2026-07-16):
  # include every branch, active or deprecated — the historical mappings still help
  # match GA4 activity to emails. ---
  identity_include_cdp_new: true          # mis_2_email_clientid_new (cdp_profile_sync.user_identifiers) - ACTIVE (monthly)
  identity_include_ga4_sap: true          # mis_2_ga4_sap_clientid (GA4 + SMC) - DEPRECATED from June 2026; kept for historical mappings
  identity_include_braze: true            # braze_ga4_email - ACTIVE (monthly)
  identity_include_cdp_legacy: true       # mis_2_email_clientid - frozen 2025-09-04; kept for historical mappings (Giorgia 2026-07-16)
  identity_include_cdp_user_traits: true  # mis_2_email_clientid_cdp - frozen 2025-02-05; kept for historical mappings (Giorgia 2026-07-16)
  identity_include_snid: true             # mis_1_email_clientid (SNID) - stopped Oct 2025; kept for historical mappings (Giorgia 2026-07-16)
  identity_conflict_strategy: 'keep_all'  # 'keep_all' (Colab union, keep all email/client_id pairs) | 'priority'

  # --- GA extract source ---
  # true  = read the accumulated prod GA extracts (mis_2_ga_data / mis_2_google_auto_1)
  #         -> ~$15 one-off, identity-independent, lets Phases 3-8 be materialised cheaply.
  # false = re-scan ~7 months of raw GA4 events (Colab-faithful) -> ~$55.
  ga_extract_from_prod: true

  # --- Identity extract source (Phase 1B) ---
  # Controls how int_ga4_sap_ids / int_braze_cep_ids source their user_pseudo_id maps.
  # true  = read the accumulated prod identity maps (mis_2_sap_ids_ga4_2 / braze_cep_ids)
  #         -> cheap (tiny tables) and reflects the full-history mappings, so
  #         int_email_clientid / email_rm_flag match prod's cumulative coverage.
  # false = re-scan raw GA4 events for the processing window only (Colab-faithful),
  #         which undercounts identity pairs in a single-month dev build.
  identity_extract_from_prod: true

  # --- Attribution windows / thresholds ---
  attribution_window_days: 180            # DATE_DIFF(submission, event) in (0, 180]
  ga_lookback_months: 6                   # GA activity pulled 7 calendar months back (submission month - 6)
  google_multichannel_threshold: 0.8      # pct sessions > 0.8 to allocate SEA/ED (main MIS path)
  channel_planning_multi_threshold: 0.5   # pct sessions > 0.5 (Phase 8 channel-planning path)

  # --- Phase 8 channel planning ---
  # snapp_regional_clusters is a Google Sheets external table (Drive scope blocked by
  # SN policy), so region enrichment is OFF by default; region/country_grouping are
  # null until a native/seed equivalent is provided. See assumptions-register E2.
  enable_regional_clusters: false

  # --- Business rules ---
  power_author_labels: ['d. Power author (21+)', 'Power author']
  repeated_author_full_history: true      # Giorgia (2026-07-16): lookback must span full history to the submission date (=1 if any author previously submitted), not just the processed window
  collection_email_types: ['coll_algo_canto', 'coll_optin_etoc', 'coll_retain_and_gain', 'coll_referral', 'coll_optin_other']

  # --- "Genuine researcher" / trackable-user filter (Colab mis_2_latest_month_users_2) ---
  gr_min_sessions: 1                       # n_session_starts > gr_min_sessions
  gr_max_sessions: 360                     # n_session_starts < gr_max_sessions
  gr_min_pv_per_session: 1                 # n_pageviews_per_session > gr_min_pv_per_session
  gr_max_pv_per_session: 100              # n_pageviews_per_session < gr_max_pv_per_session

models:
  marketing_influenced_submissions:
    +persist_docs:
      relation: true
      columns: true
    raw:
      +materialized: view
      +tags: [raw]
    staging:
      +materialized: view
      +tags: [staging]
    intermediate:
      +materialized: table
      +tags: [intermediate]
    presentation:
      +materialized: table
      +tags: [presentation]
